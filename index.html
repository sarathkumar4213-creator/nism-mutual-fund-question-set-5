sued by a bank will be for ________ .3 days to 2 Years7 days to 1 Year45 days3 years WRONG ANSWERCORRECT ANSWER: 7 days to 1 Year Explanation: A Certificate of Deposit is a fixed-income financial tool that is governed by the Reserve Bank of India and is issued in a dematerialized form. It is a type of agreement made between the depositors and the banks, wherein the bank pays an interest on your investment. Certificates of Deposit are issued by Banks (for 7 days to 1 year) or by Financial Institutions (for 1 to 3 years). Q 30. Identify the TRUE statement with respect to Trustees of mutual funds.The Trustees can legally change the Asset Management Company (AMC)The Asset Management Company (AMC) appoints the TrusteesThe Trustees appoint the Sponsors of the Asset Management Company (AMC)The Trustees have to approve the appointment of the distributors of its mutual fund schemes CORRECT ANSWER Explanation: The Trustees act as the guardians of the mutual fund and are responsible for protecting the interests of the investors. They supervise the functioning of the Asset Management Company (AMC) and ensure that it complies with SEBI regulations. If the AMC fails to perform its duties properly or acts against the interests of unit holders, the Trustees have the legal authority to replace it. However, the Trustees are not appointed by the AMC and do not approve the appointment of distributors, as these responsibilities lie with the Sponsor and the AMC. The Sponsor is the entity that establishes the mutual fund. It is the Sponsor who appoints the Trustees, not the other way around. Q 31. Identify which of these are Non-Financial transactions?A) Transmission B) Nomination C) Pledge D) SwitchTransmission, Nomination, SwitchTransmission, Nomination, PledgeTransmission, Pledge, SwitchNomination, Pledge, Switch WRONG ANSWERCORRECT ANSWER: Transmission, Nomination, Pledge Explanation: Pledge of units. Nomination and Transmission are  Non Financial transactions in a mutual fund. A Switch is redemption from one scheme and a purchase into another, combined into one transaction and is a financial transaction. Q 32. How will an application to subscribe mutual fund units be treated if an AMFI Registration Number (ARN) is mentioned in the application form and the choice of Regular Plan is indicated ?It will be treated as an incomplete application and rejectedIt will be treated as a regular plan applicationIt will be treated as an incomplete application and returned for completionIt will be treated as a direct plan application WRONG ANSWERCORRECT ANSWER: It will be treated as a regular plan application Explanation: If investment (purchase/repurchase) is routed through a distributor, then it is considered that one has chosen to invest in the Regular Plan. Mutual Fund distributors shall quote a valid ARN and EUIN in the client’s application / transaction feed, in order to place transactions in Regular Plan and receive commissions. Q 33. The NAV which is applicable for processing an investor transaction depends on whether the transaction is received within the _________ .Asset Management Company's office timingsR&T Agents office timingsStock Markets timingCut-off time for the scheme WRONG ANSWERCORRECT ANSWER: Cut-off time for the scheme Explanation: The sale and re-purchase prices are a function of the applicable NAV for the transaction. The applicable NAV depends on the cut-off time prescribed for the particular type of scheme and the transaction value. Q 34. The additional Total Expense Ratio (TER) charged has to be credited back to the Mutual Fund scheme if the inflows from beyond the top 30 cities are redeemed within a period of 1 year from the date of investment. State whether True or False?TrueFalse CORRECT ANSWER Explanation: Mutual funds are allowed to charge an additional TER for inflows from cities beyond the top 30 (B-30 cities). However, if such investments are redeemed within one year, the extra TER collected must be credited back to the scheme. This ensures that investors from B-30 cities are encouraged to stay invested longer. Q 35. A mutual fund scheme shall not invest more than 10 percent of its total NAV in debt instruments. This rule is not applicable for which type of debt instrument?Triparty repo on Government securitiesTreasury BillsGovernment SecuritiesAll of the above WRONG ANSWERCORRECT ANSWER: All of the above Explanation: Restrictions pertaining to investment in Debt Securities: A mutual fund scheme shall not invest more than 10 percent of its total NAV in debt instruments comprising money market instruments and non-money market instruments issued by a single issuer which are rated not below investment grade by a credit rating agency authorized to carry out such activity under the Act. However such limit shall not be applicable for investments in Government Securities, Treasury bills and Triparty repo on Government securities or treasury bills. Q 36. In the Mutual Fund industry - every AMC gives an ARN code number to the mutual fund distributor which is to be renewed every three years - True or False?True - this is as per SEBI rulesFalse - AMFI issues the ARN code number. WRONG ANSWERCORRECT ANSWER: False - AMFI issues the ARN code number. Explanation: The ARN code is given by the Association of Mutual Funds in India (AMFI) and not by the AMC. After obtaining the NISM VA certification and completing KYD requirements, one has to register with AMFI. On registration, AMFI allots an AMFI Registration Number (ARN). Q 37. No investor can have a holding of more than 25 percent of a scheme - State True or False?TrueFalse CORRECT ANSWER Explanation: As per SEBI’s 20/25 Rule for mutual funds: A mutual fund scheme must have at least 20 investors. No single investor can hold more than 25% of the scheme’s corpus. Q 38. Long-term capital gains will be taxed after adjusting for _______ , if any.long-term capital loss onlyshort-term capital loss onlyboth long-term and short-term capital loss WRONG ANSWERCORRECT ANSWER: both long-term and short-term capital loss Explanation: As per Income Tax Act : 1. Short term capital loss is to be set off against short term capital gain or long- term capital gain 2. Long term capital loss can only be set off against long term capital gain. 3. Capital loss, short term or long term, cannot be set off against any other head of income (e.g., salaries). Thus, as per points 1 and 2, Long term capital gains will be taxed after adjusting for both long term and short term capital loss. Q 39. The sponsor of a mutual fund can be compared to the Chief Executive of a company - State True or False?TrueFalse WRONG ANSWERCORRECT ANSWER: False Explanation: The sponsor of a mutual fund is similar to a promoter of a company, as it sets up the mutual fund and appoints the trustees and the Asset Management Company (AMC). The Chief Executive role is performed by the AMC, not the sponsor. Q 40. Identify the TRUE statement/s -A. Time stamping is relevant only for Financial transactions and not for Non-Financial transactionsB. Time stamping is relevant for both Financial and Non-Financial transactionsOnly A is trueOnly B is trueBoth A and B are true CORRECT ANSWER Explanation: Time stamping for financial transactions like purchase and redemptions etc. is very crucial as it determines the NAV at which the transaction will take place. Time stamping for non-financial transactions like the change of address, investor’s acknowledgement etc. is not crucial. Only date stamping is important for such non-financial transactions. Q 41. Key Information Memorandum (KIM) and Scheme Information Document (SID) are two broad types of scheme documents - State whether True or False?TrueFalse WRONG ANSWERCORRECT ANSWER: False Explanation: Scheme Information Document (SID) and Statement of Additional Information (SAI) are primarily the two important documents. Key Information Memorandum (KIM) is a summary of SID and SAI. Q 42. _______ will help the investors understand the suitability of a mutual fund scheme to them.Product LabelStandard Deviation / BetaTracking ErrorAlpha of the scheme CORRECT ANSWER Explanation: The risk levels in different categories of mutual fund schemes can be understood with the help of product labelling of Mutual Funds. SEBI had introduced product labelling of mutual funds to address the issue of mis-selling and to provide investors an easy understanding of the kind of product/scheme they are investing in and its suitability to them. All the mutual funds were required to ‘Label’ their schemes on the parameters such as - Nature of scheme, Investment objective, Level of risk depicted by colour code boxes etc. Q 43. Redemption proceeds has to be paid to the mutual fund unit holders within the time specified by _____ from time to time.AMFISEBIRegistrar of CompaniesMinistry of Finance WRONG ANSWERCORRECT ANSWER: SEBI Explanation: The applicable redemption guidelines for mutual funds are set out in SEBI (Mutual Funds) Regulations, 1996 and as amended from time to time. Q 44. Who has to ensures the compliance of the information contained in the scheme related documents with regulations?The SponsorsThe Asset Management CompanySEBIThe Trustees WRONG ANSWERCORRECT ANSWER: The Trustees Explanation: A Compliance Officer signs a due-diligence certificate to the effect that all regulations have been complied with, and that all the intermediaries mentioned in the scheme related documents have the requisite statutory registrations and approvals.  The Compliance Officer works closely with the Trustees on various compliance and regulatory issues. It is the responsibility of the compliance officer to report any issue of non-compliance directly and immediately to the trustees. Q 45. In case of an Index Fund, the minimum investment in securities of a particular index (which is being replicated/ tracked) shall be ________ .80% of the total assets85% of the total assets90% of the total assets95% of the total assets WRONG ANSWERCORRECT ANSWER: 95% of the total assets Explanation: Index Funds are open-ended scheme replicating/tracking a specific index. The minimum investment in securities of a particular index (which is being replicated/ tracked) shall be 95 percent of total assets. Q 46. Identify the TRUE statement/s :1. The Beta of a diversified stock index is greater than 12. An investment with a beta of 0.8 will move 8 percent when markets move by 10%3. Beta as a measure of risk is relevant only for equity schemes.Only 1 and 2 are trueOnly 2 and 3 are trueOnly 1 and 3 are trueAll 1, 2 and 3 are true WRONG ANSWERCORRECT ANSWER: Only 2 and 3 are true Explanation: Beta measures the fluctuation in periodic returns in a scheme, as compared to fluctuation in periodic returns of a diversified stock index (representing the market) over the same period. The diversified stock index, by definition, has a Beta of 1. Companies or schemes, whose beta is more than 1, are seen as riskier than the market. Beta less than 1 is indicative of a company or scheme that is less risky than the market. An investment with a beta of 0.8 will move 8 percent when markets move by 10 percent. This applies to increase as well as fall in values. An investment with a beta of 1.2 will move by 12 percent both on the upside and downside when markets move (up/down) by 10 percent. Beta as a measure of risk is relevant only for equity schemes. Q 47. Which of the following have the highest credit risk?Money Market FundJunk BondG-Sec FundIncome Fund WRONG ANSWERCORRECT ANSWER: Junk Bond Explanation: Junk bonds are a type of bond that carries a higher risk of default. The issuer of such bonds may not have the adequate cash flow to pay regular interest or repay the principal amount to the bondholders at the time of maturity. The bonds issued by financially struggling companies are termed junk bonds but they pay higher returns to make them attractive to investors. Q 48. Identify the information which is NOT included in the Statement of Additional Information (SAI).Rights of Unit-holdersTransmission procedureSIP returns of the schemesInvestment Valuation Norms WRONG ANSWERCORRECT ANSWER: SIP returns of the schemes Explanation: Statement of Additional Information (SAI), which has statutory information about the mutual fund or AMC, that is offering the scheme like the Constituents of the mutual fund, Rights of Unit-holders, Investment Valuation Norms, Rights of Unit-holders etc. It does not contain information on scheme returns etc. This information is available in the Mutual Fund Fact Sheet. Q 49. An Addendum has to be issued for changes in _______ .Fund Fact SheetHalf yearly results of the mutual fundScheme Information Document (SID)Statement of Additional Information (SAI) WRONG ANSWERCORRECT ANSWER: Scheme Information Document (SID) Explanation: Any changes in the fundamental attributes of a mutual fund scheme require an Addendum to the SID. This ensures that investors are formally notified of modifications in scheme details such as investment objectives, asset allocation, or risk factors. Q 50. Identify the INCORRECT statement/s with respect to investments in real estate.The minimum amount required (Ticket size) for investing in real estate is high compared to other financial assetsThe transaction costs are low for investments in real estate as compared to other financial assetsThe real estate market is quiet illiquid and the pricing is not transparentAll of the above are incorrect WRONG ANSWERCORRECT ANSWER: The transaction costs are low for investments in real estate as compared to other financial assets Explanation: Transaction costs, in the form of stamp duty, registration fees, brokerage etc. are high in real estate transactions. Therefore the statement - 'The transaction costs are low for investments in real estate as compared to other financial assets'  is incorrect. Real estate is a less liquid asset class. The intermediation chain of real estate agents is largely unorganized in India. . Regulatory risk is high in real estate, as is the risk of litigation and other encumbrances. The transparency level is low even among the real estate development and construction companies. Q 51. The portfolio of a fund of funds consists of ______ .Equity securities onlyDebt securities onlyUnits of other mutual fund schemesMoney market securities only WRONG ANSWERCORRECT ANSWER: Units of other mutual fund schemes Explanation: A ‘Fund Of Funds’ (FOF) is an investment strategy of holding a portfolio of other investment funds rather than investing directly in stocks, bonds or other securities. An FOF Scheme of a primarily invests in the units of another Mutual Fund scheme. Q 52. Which of the following is true for unclaimed dividend in mutual fund schemes?Asset Management Company is expected to make a continuous effort to remind the investors to claim their duesThe responsibility for ensuring that the dues are claimed lies with the distributor in a dividend planThe responsibility for ensuring that the dues are claimed lies solely with the investor CORRECT ANSWER Explanation: AMC is expected to make a continuous effort to remind the investors through letters to claim their dues. The Annual Report has to mention the unclaimed amount and the number of such investors for each scheme. Q 53. Identify the TRUE statements with respect to measuring returns for mutual fund schemes.1. The returns published in a mutual fund advertisement should factor the entry or exit load2. Compounded Annual Growth Rate (CAGR) is the accepted standard of showing returns for investment of holding period of more than one year3. Simple returns can be calculated by the formula :(Sale price – Cost price) / Cost price x 100Only 1 and 2 are trueOnly 2 and 3 are trueOnly 1 and 3 are trueAll 1, 2 and 3 are true WRONG ANSWERCORRECT ANSWER: Only 2 and 3 are true Explanation: Statement 1 is false because - the returns published in a mutual fund advertisement would be without factoring the entry or exit load. Statement 2 is true because - CAGR is the standard way to present returns for an investment held for more than one year, as it annualizes the return. Statement 3 is true because -The Simple Return is calculated with the following formula : (Sale price – Cost price) / Cost price  x 100 Q 54. Ms. Apeksha invests Rs 2 crore in a Gilt scheme at 2 pm with a local cheque. What would be the applicable NAV for allotment of units?Closing NAV of date of applicationClosing NAV of next business dayClosing NAV of day immediately preceding the date of applicationNAV of the business day on which the funds are available for utilization WRONG ANSWERCORRECT ANSWER: NAV of the business day on which the funds are available for utilization Explanation: For large investments of Rs. 2 Lakhs and above, SEBI has a special rule — the cut-off time (3:00 PM) does NOT matter! What matters is when the money actually reaches the AMC's bank account and is realised. The applicable NAV depends on when the funds are actually available for utilization by the mutual fund. Since the investor invested Rs.2 crore at 2 PM, the same-day NAV may not apply unless funds are credited and available before the cut-off rules. Therefore, the investor gets the NAV of the day when the funds become available for use. Q 55. Ms Shweta purchases through a distributor 5000 units of a mutual fund scheme at a NAV of Rs 30. The current NAV of the scheme is Rs 28. What will be the trail commission for today if the trail commission rate is 1% per annumRs. 13.8356Rs. 7.2256Rs. 26.7463Rs. 3.8356 WRONG ANSWERCORRECT ANSWER: Rs. 3.8356 Explanation: Trail commission is always calculated on the current NAV. The current total value of investments in the above question is Rs. 28 X 5000 units = Rs. 1,40,000 Trail commission for the day = Current value X trail commission rate p.a./365 = 1,40,000 X 1%  / 365 days = 1400 / 365  = Rs. 3.8356 Q 56. For units of Equity Linked Savings Scheme (ELSS), the lock-in period is ______ .three years from the date of original investment, even in case of subsequent purchases by SIPthree years from the date of original investment for each individual unit for purchases made by SIPThere is no lock-in period if tax exemption is claimed WRONG ANSWERCORRECT ANSWER: three years from the date of original investment for each individual unit for purchases made by SIP Explanation: If one is investing in ELSS through SIP then each investment would be locked-in from the date of the respective investment. The lock-in for the entire amount would not get over on completion of 3 years from the date of the first SIP instalment. Q 57. ______ is used to measure fund’s risk relative to market index.Tracking errorBeta coefficientTreynor ratioSharpe ratio WRONG ANSWERCORRECT ANSWER: Beta coefficient Explanation: Beta is a commonly used risk measure and calculates the relative volatility of a stock or Mutual Fund’s returns as against its benchmark. For example, if the Beta of a Mutual Fund scheme is 1, it means the fund moves in line with the benchmark. Likewise, say the Beta of a fund is higher than 1. Assume it is 1.5. So, if the NIFTY 50 jumps by 1%, the fund benchmarked against NIFTY 50 is likely to go up by 1.5%. Q 58. Who manages the contributions from investors and takes investment decisions in a mutual fund company?The InvestorsThe TrusteesThe Asset Management Company (AMC)The Sponsors WRONG ANSWERCORRECT ANSWER: The Asset Management Company (AMC) Explanation: Fund management is the most critical function in an Asset Management Company. The main function of this team is to invest the investors’ money in line with the stated objective of the scheme and to manage the same effectively. Q 59. The __________ is used by the fund manager to communicate their views on the economy and the markets to the investorsKey Information Memorandum (KIM)Statement of Additional Information (SAI)Scheme Information Document (SID)Fund Factsheet WRONG ANSWERCORRECT ANSWER: Fund Factsheet Explanation: A Fund Factsheet is like a monthly report card of a mutual fund scheme. It is published every month by the AMC and is the most investor-friendly document among all MF documents. It typically includes the fund manager's commentary on the economy, current market conditions, sector outlook, portfolio composition, top holdings, and scheme performance — making it the go-to document for anyone wanting to understand where the markets are headed and how the fund is positioned. Q 60. The equity share prices of gold mining companies can depend on :1. The gold reserves of the company2. The operational efficiency and management of the company3. International prices of goldOnly 1 and 2Only 2 and 3Only 1 and 3All 1, 2 and 3 WRONG ANSWERCORRECT ANSWER: All 1, 2 and 3 Explanation: Profitability of gold mining companies is linked to several factors. For eg. - When gold metal price increases, gold mining companies with large reserves of gold can appreciate If there are concerns about a company’s management the share prices may see a decline irrespective of the price of gold. Q 61. Identify the FALSE statement/s :1. A mutual fund investing across many countries will keep its benchmark index which is based on US equity markets2. For Gold ETF, gold prices will be the ideal benchmarkOnly 1 is falseOnly 2 is falseBoth 1 and 2 are false CORRECT ANSWER Explanation: The benchmark would depend on where the scheme proposes to invest. Thus, a scheme seeking to invest in China might have the Shanghai Composite Index (Chinese index) as the benchmark. S&P 500 may be appropriate for a scheme that would invest largely in the US market. A scheme that seeks to invest across a number of countries, can structure a synthetic index that would be a blend of the indices relevant to the countries where it proposes to invest. Gold ETF NAVs closely track the price of gold since it reflects the value of gold held in custody for the units issued. Therefore, gold price would be the benchmark for such funds. Q 62. An Asset Management Company (AMC) can recover investment management and advisory fees on management of the unclaimed amounts, ________ .only on the actual expenses incurred in holding the fundsat a maximum rate of 0.50 percent per annumas per the fee applicable on the scheme from which the redemption was madeNo investment management and advisory fees can be charged on unclaimed amounts WRONG ANSWERCORRECT ANSWER: at a maximum rate of 0.50 percent per annum Explanation: AMC is expected to make a continuous effort to remind the investors through letters to claim their uncliamed amounts. AMC can recover investment management and advisory fees on management of these unclaimed amounts, at a maximum rate of 0.50 percent per annum. Q 63. Identify which among the following is the first step in the sequence of creating a mutual fund product?Launching the New Fund Offer (NFO)Filing of Scheme Information Document (SID) with SEBI for observationLaunch of advertising and public relations campaigns by AMCApproval of Trustees and AMC board for the new product and drafting of SID WRONG ANSWERCORRECT ANSWER: Approval of Trustees and AMC board for the new product and drafting of SID Explanation: Units in a mutual fund scheme are offered to investors for the first time by a New Fund Offer (NFO).The following are a few key steps leading to the NFO : 1. AMC decides on a scheme to take to the market. This is decided on the basis of inputs from the Chief Investment Officer (CIO) and the Chief Marketing Officer (CMO) 2. AMC prepares the Scheme Information Document (SID) for the NFO. This needs to be approved by the Trustees and the Board of Directors (BoD) of the AMC. 3. The documents are then filed with SEBI. 4. The AMC decides on a suitable timetable for the issue. launches its advertising and public relations campaigns etc 5. The Scheme Documents and Application Forms are distributed to market intermediaries, and circulated in the market so that investors can apply in the NFO. Q 64. From the below mentioned entities associated with a mutual fund, who has to mandatorily contribute to the corpus of the mutual fund?The TrusteesThe CustodiansThe Asset Management CompanyThe Sponsors WRONG ANSWERCORRECT ANSWER: The Sponsors Explanation: The mutual fund trust is created by one or more Sponsors, who are the main persons behind the mutual fund business. The sponsor is the promoter of the mutual fund. The sponsor brings in capital and creates a mutual fund trust and sets up the AMC. The sponsor makes an application for registration of the mutual fund and contributes at least 40% of the net worth of the AMC. In other words, every MF needs a sponsor before it can commence operations. Q 65. The benchmark for a debt mutual fund scheme could be chosen on the basis of Scheme Type and Scheme Size. - State whether True or False?TrueFalse WRONG ANSWERCORRECT ANSWER: False Explanation: Scheme type and Choice of investment universe drive the choice of benchmark in debt schemes. For eg - Liquid schemes invest in securities of up to 91 days’ maturity. Therefore, a short-term money market benchmark such as NSE’s MIBOR or CRISIL Liquid Fund Index is suitable. Choice of Investment Universe Gilt funds invest only in Government securities. Therefore, indices based on Government Securities are appropriate. Debt funds that invest in a wide range of Government and Non-Government securities need to choose benchmarks that are calculated based on a diverse mix of debt securities. The size of the scheme is immaterial. Q 66. Once the mutual fund units are pledged, the unit holder/s _______ .Cannot sell the unitsCan sell the units but after a period of 3 monthsCannot sell the units but can switch the units to another schemeCannot do additional purchase in the same account CORRECT ANSWER Explanation: Banks, NBFCs and other financiers often lend money against the pledge of Units by the Unitholder. Once units are pledged, the Unit-holder/s cannot sell or switch out the pledged units, until the pledgee gives a written no-objection to release the pledge. Q 67. Where is the performance data for all schemes across the mutual fund industry available?The Scheme Information Document (SID)Key Information Memorandum (KIM)AMFI WebsiteThe Fund Fact Sheet WRONG ANSWERCORRECT ANSWER: AMFI Website Explanation: Each AMC is required to publish a scheme performance dashboard on its website, and update it on a regular basis. The scheme performance data is also available on the AMFI website AMFI website (www.amfiindia.com) carries the performance data of all the mutual fund schemes.This is an exhaustive resource and one can access the same for various different periods, and fund categories. Q 68. What would be the impact on an International fund investing in US stocks when the US Dollar appreciates against Indian Rupee?The NAV of the scheme in Indian Rupees will appreciateThe NAV of the scheme in Indian Rupees will depreciateNo impact on the fund as its investing in stocks and not currency CORRECT ANSWER Explanation: When an Indian investor invests in equities abroad, he is essentially taking two exposures: - An exposure on the international equity market. - An exposure to the exchange rate of the rupee. If the investor invests in the US, and the US Dollar becomes stronger during the period of his investment, he benefits; if the US Dollar weakens (i.e., Rupee becomes stronger), he loses or the portfolio returns will be lower. Q 69. How will the AMC /R&T agent process an application for subscribing to mutual fund units if the ARN is wrongly mentioned in it?It will be processed as a direct plan applicationIt will be rejected as incomplete applicationIt will be considered as an incomplete application and sent back for completionIt will be treated as a regular plan subject to the error being corrected in the required time frame WRONG ANSWERCORRECT ANSWER: It will be treated as a regular plan subject to the error being corrected in the required time frame Explanation: If the wrong ARN code is mentioned in the application form, then the application will be processed as a Regular Plan. However, the AMC will contact the investor/distributor for the right ARN code within 30 calendar days of the receipt of the application form. If the error is not rectified within these 30 days, the application will be reprocessed as a direct application without charging any exit load. Q 70. Which one of these is an advantage of investing in Mutual Funds?Economies of scalePortfolio customizationChoice overloadAll of the above CORRECT ANSWER Explanation: Large investment corpus of a mutual fund leads to various other economies of scale. For instance, costs related to investment research and office space gets spread across investors. Further, the higher transaction volume makes it possible to negotiate better terms with brokers, bankers and other service providers. Limitations of Mutual Fund - Lack of Portfolio Customization - A unitholder cannot influence what securities or investments the scheme would invest into. Choice Overload - There are multiple mutual fund schemes offered by several mutual fund houses and multiple options within those schemes which makes it difficult for investors to choose between them."}];const questions=[{"n": 1, "q": "A Systematic Transfer Plan (STP) is essentially a combination of which of the following ?", "opts": ["A one-time investment followed by a one-time redemption between two mutual fund schemes", "Multiple purchases followed by multiple redemptions within the same mutual fund scheme", "A lump sum investment followed by periodic redemptions between two mutual fund schemes", "A Systematic Withdrawal Plan (SWP) and a Systematic Investment Plan (SIP) occurring simultaneously between two mutual fund schemes"], "ans": "A Systematic Withdrawal Plan (SWP) and a Systematic Investment Plan (SIP) occurring simultaneously between two mutual fund schemes", "exp": "A Systematic Transfer Plan (STP) allows investors to move money at regular intervals from one mutual fund scheme (usually a debt or liquid fund) to another (often an equity fund). It works like a Systematic Withdrawal Plan (SWP) from the source scheme and a Systematic Investment Plan (SIP) into the target scheme, happening together. Both these actions happen simultaneously and automatically, making STP essentially a SWP + SIP combo running together between two schemes."}, {"n": 2, "q": "Which of the following is mandatory for a distributor to become empaneled with an AMC?", "opts": ["More than 10 years of mutual fund distribution experience", "Registration with SEBI", "Completion of KYC formalities", "Completion of the Know Your Distributor (KYD) process"], "ans": "Completion of the Know Your Distributor (KYD) process", "exp": "Before empanelment with mutual funds or AMCs, mutual fund distributors must complete the Know Your Distributor (KYD) process. The KYD process involves verification of the distributor's identity, address, bank details, and AMFI Registration Number (ARN) — ensuring that only genuine and verified intermediaries are allowed to distribute mutual funds. A SEBI registration is not required for MF distributors — they operate under an ARN (AMFI Registration Number) issued by AMFI."}, {"n": 3, "q": "Which of the following best describes the concept of Asset Allocation?", "opts": ["Choosing how many mutual fund schemes an investor should hold", "Determining which asset class will generate superior returns", "Allocating money among various asset categories according to financial objectives, present financial condition and risk appetite", "All of the above"], "ans": "Allocating money among various asset categories according to financial objectives, present financial condition and risk appetite", "exp": "Asset Allocation is a fundamental investment strategy that involves dividing an investment portfolio across different asset classes such as equity, debt, gold, real estate, and cash equivalents. The allocation is not random — it is carefully determined based on three key personal factors: the investor's financial goals (retirement, child's education, etc.), current financial situation (income, liabilities, time horizon), and risk profile (conservative, moderate, or aggressive)."}, {"n": 4, "q": "What change regarding Dividend Distribution Tax (DDT) was introduced in the Union Budget 2020?", "opts": ["DDT was abolished for all categories of mutual fund schemes", "The DDT rate was reduced, but the tax continued to apply", "DDT was removed only for equity-oriented mutual fund schemes, while continuing for non-equity schemes", "DDT was removed only for non-equity mutual fund schemes, while continuing for equity-oriented schemes"], "ans": "DDT was abolished for all categories of mutual fund schemes", "exp": "In the Union Budget 2020, the Government abolished Dividend Distribution Tax (DDT) on mutual funds. Earlier, mutual fund companies paid DDT before distributing dividends to investors. After abolition, dividend income became taxable directly in the hands of investors according to their income tax slab."}, {"n": 5, "q": "Which of the following indicates that a scheme does not benefit from economies of scale?", "opts": ["Net Asset Value (NAV)", "Small fund size", "Cost of fund management", "None of the above"], "ans": "Small fund size", "exp": "Economies of scale mean that larger funds can spread their expenses over more assets, reducing cost per investor. Such large funds spread costs across many investors, lowering expenses. A smaller fund size does not get this benefit because expenses are spread over a lower asset base, so costs per investor stay high. This means smaller fund size prevents economies of scale."}, {"n": 6, "q": "Which document contains details such as minimum investment requirements, investor service center locations, and the process for purchasing mutual fund units?", "opts": ["Fund Factsheet", "Application form", "Key Information Memorandum", "Transaction slip"], "ans": "Key Information Memorandum", "exp": "The Key Information Memorandum (KIM) contains essential details about a mutual fund scheme in a simple and summarized form. It includes information such as minimum investment amount, investor service centres, purchase procedure, and other important scheme details. The KIM helps investors quickly understand the scheme before investing."}, {"n": 7, "q": "An application submitted for repurchase of mutual fund units is stamped with __________ . A) ARN number of the distributor B) Automatically generated location code C) Machine identifier", "opts": ["A and B", "B and C", "A and C", "All A, B and C"], "ans": "B and C", "exp": "As per mutual fund transaction processing rules, repurchase applications are stamped with an automatically generated location code and machine identifier. These details help in proper time-stamping and tracking of transactions for NAV applicability and audit purposes. ARN of the distributor is not part of the mandatory stamping requirement on repurchase applications."}, {"n": 8, "q": "Identify the correct statement(s) related to risk in mutual fund schemes: A) Credit Risk Funds generally carry a higher default risk compared to Corporate Bond Funds B) The NAV of gilt funds may fluctuate significantly more than liquid funds because of changes in market yields", "opts": ["Only A", "Only B", "Both A and B", "None of the above"], "ans": "Both A and B", "exp": "Credit Risk Funds chase higher returns by investing in lower-rated bonds (below AA) — this means the companies issuing these bonds have a higher chance of defaulting on repayment.  Corporate Bond Funds stick to high quality AA+ and above rated bonds — much safer but with slightly lower returns. So, Credit Risk Funds have a higher default risk than Corporate Bond Funds. Gilt funds invest in long-term government bonds (sometimes 10–30 year maturity). When interest rates/yields rise, the prices of these bonds fall sharply — causing significant NAV fluctuation. Liquid funds invest in instruments maturing within 91 days, so yield changes barely affect their NAV."}, {"n": 9, "q": "Investments held in a mutual fund portfolio are valued at:", "opts": ["Book value", "Face value", "Market value", "Cost price"], "ans": "Market value", "exp": "Mutual fund investments are valued using their current market price. This helps calculate the correct Net Asset Value (NAV) of the scheme every day. Face value, book value, or purchase cost may not reflect the current worth of the securities. Therefore, mutual fund portfolios are valued at market value."}, {"n": 10, "q": "The interest rate sensitivity of a mutual fund scheme having a longer average maturity is generally:", "opts": ["High", "Medium", "Moderate", "Low"], "ans": "High", "exp": "Interest rate sensitivity refers to how much the price of a bond or debt fund changes when interest rates move. Mutual funds with long average maturity hold long-term bonds, which have higher duration. Duration is the key measure of sensitivity. This is because the fund is locked into current interest rates for a longer period, making it more vulnerable to rate fluctuations. When interest rates rise, the prices of these long-term bonds fall more sharply, leading to greater volatility in the fund’s NAV. Conversely, if interest rates decline, such funds benefit more, as bond prices rise significantly. Hence, investors in long maturity debt funds face higher risk and reward potential compared to short maturity funds."}, {"n": 11, "q": "Which of the following statements correctly reflects SEBI guidelines regarding Income Distribution cum Capital Withdrawal (IDCW), formerly known as dividends, in mutual fund schemes?", "opts": ["IDCW can be paid only from dividends earned by the scheme from its investments", "IDCW may be distributed only out of distributable reserves", "IDCW may be distributed only if the current NAV exceeds Rs. 10", "Mutual fund schemes are prohibited from distributing IDCW to unit holders"], "ans": "IDCW may be distributed only out of distributable reserves", "exp": "As per SEBI guidelines, mutual fund schemes can distribute IDCW only from distributable surplus/reserves available in the scheme. Which means only from realized profits and surplus available in the scheme. The fund cannot distribute more than what it has earned and realized — preventing any artificial or funded payouts. IDCW is not guaranteed and depends on the availability of distributable reserves. It is not necessary that NAV should be above Rs. 10 for paying IDCW. Also, IDCW is not restricted only to dividends received from invested companies."}, {"n": 12, "q": "Identify the true statement(s) regarding arbitrage funds: A) Arbitrage funds are riskier compared to equity mutual funds B) Arbitrage funds aim to exploit price inefficiencies between different market segments", "opts": ["Statement A only", "Statement B only", "Both statements A and B", "None of the above"], "ans": "Statement B only", "exp": "Statement B is true :  Arbitrage funds try to earn profit from price differences of the same security in different markets, such as cash and futures markets. It works on very simple principle — \"Buy Low in one market, Sell High in another market simultaneously.\" Statement A is false :  Since every position is hedged (covered), the risk is actually very low — much lower than regular equity funds. Therefore, arbitrage funds generally have lower risk than equity funds since positions are usually hedged."}, {"n": 13, "q": "At what stage does a nominee become entitled to have mutual fund units transferred in their name ?", "opts": ["Once the nomination is made by the unit holders", "Once the nomination is registered by the mutual fund", "Upon the death of the first unit holder", "Upon the death of all unit holders"], "ans": "Upon the death of all unit holders", "exp": "In a jointly held mutual fund account, if the first holder passes away, the surviving joint holders automatically continue to hold the units. The nominee’s right arises only when no registered holder remains alive."}, {"n": 14, "q": "Which among the following statements about real estate investments is NOT true?", "opts": ["The ticket size for investing in real estate is usually higher compared to financial investments", "Real estate investments are illiquid and cannot be readily converted into cash in a few days at a clear market price", "Real estate transactions generally carry lower costs than investments in financial assets", "All of the above"], "ans": "Real estate transactions generally carry lower costs than investments in financial assets", "exp": "Real estate investments involve very high transaction costs — including stamp duty, registration charges, brokerage fees, legal charges, and maintenance costs. Therefore the statement - 'Real estate transactions generally carry lower costs than investments in financial assets' is false. The other two statements are true — real estate is indeed illiquid (cannot be sold quickly at a fair price within days), and the ticket size is very high (you need lakhs or crores to invest, unlike mutual funds where you can start with Rs. 500)."}, {"n": 15, "q": "What is the NAV if the value of stocks in a Mutual Fund scheme is Rs 100 cr, Value of Bonds is Rs 10 cr, Value of Money Market Instruments is Rs 25 cr, Dividend Accrued but not received is Rs 3 cr and Fees payable is Rs 5 cr. The number of outstanding units is 75 lacs.", "opts": ["173.33", "177.33", "184", "186.74"], "ans": "177.33", "exp": "NAV = (Value of stocks + Value of bonds + Value of money market instruments + Dividend accrued but not received  – Fees payable) / No. of outstanding units = 100 cr + 10 cr + 25 cr + 3 cr - 5 cr  /  75 lacs (75 lacs = 0.75 cr) = 133 cr / 0.75 cr = 177.33"}, {"n": 16, "q": "Identify the transactions on which Securities Transaction Tax (STT) is applicable", "opts": ["Purchase transactions of debt mutual funds", "Purchase transactions of equity mutual funds", "Redemption transactions of debt mutual funds", "Redemption transactions of equity mutual funds"], "ans": "Redemption transactions of equity mutual funds", "exp": "When an investor sells units of an equity fund in the stock exchange, or offers them for repurchase to the fund, he will have to incur Securities Transaction Tax (STT) i.e., STT is applicable only on redemption/switch to other schemes/sale of units of equity oriented mutual funds whether sold on stock exchange or otherwise. STT is not applicable on purchase of units of an equity scheme. It is also not applicable to transactions in debt securities or debt mutual fund schemes."}, {"n": 17, "q": "Identify the TRUE statement with respect to regulation of mutual funds in India.", "opts": ["AMFI along with SEBI regulates the mutual funds in India", "The two stock exchanges NSE and BSE regulate the open-end mutual fund schemes", "SEBI regulates the mutual funds in India", "RBI along with SEBI regulate the bank sponsored mutual funds in India"], "ans": "SEBI regulates the mutual funds in India", "exp": "Securities markets in India are regulated by the Securities and Exchange Board of India (SEBI). It regulates, among other entities, mutual funds, depositories, custodians, registrars and transfer agents (RTAs) and credit rating agencies in the country. AMFI does not regulate the Mutual Fund. The objectives of AMFI are to define and maintain high professional and ethical standards in all areas of operation of the mutual fund industry."}, {"n": 18, "q": "Identify which of these is not included in the 'Fundamental Attributes' of a mutual fund scheme?", "opts": ["Aggregate fees and expenses charged to the scheme", "Any safety net or guarantee provided", "Exit Loads", "Liquidity provisions such as listing, repurchase, redemption"], "ans": "Exit Loads", "exp": "Within the Scheme Information Document, there is an important section on fundamental attributes of a scheme with following parameters on terms of issue : Terms of Issue - 1. Liquidity provisions such as listing, repurchase, redemption. 2. Aggregate fees and expenses charged to the scheme. 3. Any safety net or guarantee provided. Exit Loads do not form a part of 'Fundamental Attributes' of a scheme."}, {"n": 19, "q": "Tactical Asset Allocation is the decision that comes out of calls on the likely behaviour of the market - True or False ?", "opts": ["False", "True"], "ans": "True", "exp": "Tactical Asset Allocation is the decision that comes out of calls on the likely behaviour of the market. An investor who decides to go overweight on equities because of expectations of a rise in share markets, is taking a tactical asset allocation call."}, {"n": 20, "q": "What will be the minimum investment in corporate bonds (AA and below rated) in a Credit Risk fund?", "opts": ["50% of of total assets", "55% of of total assets", "60% of of total assets", "65% of of total assets"], "ans": "65% of of total assets", "exp": "Credit Risk Fund is an open-ended debt scheme investing in below highest rated corporate bonds. The minimum investment in corporate bonds shall be 65 percent of total assets (only in AA (excludes AA+ rated corporate bonds) and below rated corporate bonds)."}, {"n": 21, "q": "The Market Value of stocks of a scheme is Rs 240 crores. Dividend accrued but not received is Rs 30 crore. The Expenses payable are Rs 10 crore. The total number of outstanding units is 120 lakhs. What is the NAV of the scheme ?", "opts": ["175.80", "216.66", "224.70", "311.74"], "ans": "216.66", "exp": "Total Market Value = Rs 240 crore Add Dividend Accrued of Rs 30 crore Less Expenses Payable of Rs 10 crore Divided by Units 120 lakhs ie. 1.20 crore units 260 cr / 1.2 cr  = 216.66 NAV"}, {"n": 22, "q": "The _______ is the promoter of a Mutual Fund.", "opts": ["Trust", "AMC", "Sponsor", "Custodian"], "ans": "Sponsor", "exp": "Mutual funds are constituted as Trusts. The mutual fund trust is created by one or more Sponsors, who are the main persons behind the mutual fund business."}, {"n": 23, "q": "Identify the CORRECT statement.", "opts": ["Mutual funds can only be purchased on the stock exchange platform and they cannot be sold", "All mutual funds purchased on the stock exchange platform have a mandatory lock-in period", "Stock exchange mutual fund trading platform has become another channel for mutual fund companies to reach out to investors", "All of the above"], "ans": "Stock exchange mutual fund trading platform has become another channel for mutual fund companies to reach out to investors", "exp": "SEBI has facilitated buying and selling of the units of open-ended mutual funds through the stock exchanges. Both National Stock Exchange (NSE) and Bombay Stock Exchange (BSE) have extended their trading platforms to help the stock exchange brokers become a channel for investors to transact in Mutual Fund units."}, {"n": 24, "q": "Once the New Fund Offer (NFO) of a Close Ended Fund has closed, a person can buy the listed units of such close ended fund ____________.", "opts": ["At prices usually higher than NAV", "At prices usually lower than NAV", "At prices which can be higher or lower than NAV", "Units of a Close Ended Fund cannot be bought after NFO"], "ans": "At prices which can be higher or lower than NAV", "exp": "After the NFO of a close ended fund, sale and purchase transactions happen on the stock exchange between two different investors, and that the fund is not involved in the transaction. The transaction price is likely to be different from the NAV. Depending on the demand-supply situation for the units of the scheme on the stock exchange, the transaction price could be higher or lower than the prevailing NAV."}, {"n": 25, "q": "________ is prohibited as per the AMFI Code of Ethics.", "opts": ["Inter-Scheme transfer of securities", "Front running in those securities in which the mutual fund is dealing", "Transaction in securities through associated brokers", "Distribution of mutual fund schemes through Sponsor or its associates"], "ans": "Front running in those securities in which the mutual fund is dealing", "exp": "Front running means buying or selling of any securities ahead of transaction of the fund, with access to information regarding the transaction which is not public and which is material to making an investment decision, so as to derive unfair advantage. As per the AMFI code of ethics  - Members or any of their directors, officers or employees shall not indulge in front running."}, {"n": 26, "q": "Mohit is currently studying but wants to start a business after 5 years. The present cost of starting such a business is Rs. 10 lakhs. The inflation in the economy is 9%. Which formula should be used to calculate the amount which Mohit will need 5 years down the line?", "opts": ["10,000,00 * (1+0.09)^5", "10,000,00 / (1+0.09)^5", "10,000,00 * (1+0.09)*5", "10,000,00 * (1*0.09)^5"], "ans": "10,000,00 * (1+0.09)^5", "exp": "The formula for calculating the Future Value of an investment made today is  FV = PV * (1 + r) ^ n The PV ie. Present Value is Rs. 10 lakhs. The inflation rate (r) is 9% ie. 0.09 and time (n) is 5 years Subsituting in the formula : FV = 10,000,00 * (1+0.09)^5"}, {"n": 27, "q": "What will happen to the scheme’s Net Asset Value (NAV) after the dividend is paid?", "opts": ["The NAV will Rise", "The NAV will Fall", "The NAV will remain same"], "ans": "The NAV will Fall", "exp": "In a mutual fund, dividend is paid out of the scheme’s assets. Once the dividend is distributed, that amount is deducted from the scheme’s NAV. So, immediately after the dividend payout, the NAV falls by the dividend amount."}, {"n": 28, "q": "Identify the plan which could be used in lieu of income distribution cum capital withdrawal pay-outs?", "opts": ["Systematic Withdrawal Plan", "Systematic Transfer Plan", "Systematic Investment Plan", "None of the above"], "ans": "Systematic Withdrawal Plan", "exp": "The Income distribution cum capital withdrawal (dividend) pay-out option is for investors wanting a regular income. Systematic Withdrawal Plan(SWP) is a facility which allows an investor to withdraw a fixed amount at pre-determined intervals. Therefore an Income distribution cum capital withdrawal (dividend) pay-out option is similar to SWP. The difference is that the dividend is paid only when the fund has a surplus amount and in SWP the amount is compulsarily paid. (The dividend pay-out plan is renamed as pay-out of income distribution cum capital withdrawal, dividend re-investment plan is renamed as reinvestment of income distribution cum capital withdrawal option followed by renaming of dividend transfer plan to transfer of income distribution cum capital withdrawal plan)"}, {"n": 29, "q": "Can an investor change his mutual fund distributor?", "opts": ["Yes, but a permission from AMFI and SEBI is needed for the same", "Yes, but the investor has to give a written request to the fund house", "Yes, but an upfront fees have to be paid to the existing distributor to cover up his loss of income", "No, a change of distributor is not permitted by SEBI"], "ans": "Yes, but the investor has to give a written request to the fund house", "exp": "Investors can choose to change their distributor or opt for direct investing. This needs to be done through a written request by the investor to the AMC. In such cases, AMCs will need to comply, without insisting on any kind of ‘No Objection Certificate’ from the existing distributor."}, {"n": 30, "q": "Identify the CORRECT statement with respect to a Fund Factsheet.", "opts": ["A Fund Factsheet has to be published only at the time of a New Fund Offer (NFO)", "As per SEBI regulations, a Fund Factsheet has to be published on a monthly basis by the AMCs", "A Fund Factsheet is published by AMCs on a voluntary basis", "All mutual fund distributors have to mandatorily read the Fund Factsheet before recommending a scheme to their investors"], "ans": "A Fund Factsheet is published by AMCs on a voluntary basis", "exp": "A Fund Factsheet is a document that provides key information about a mutual fund scheme, such as portfolio holdings, asset allocation, and recent performance. SEBI does not legally mandate AMCs to publish a factsheet. However, most AMCs voluntarily publish it (usually monthly) to keep investors informed and improve transparency."}, {"n": 31, "q": "Identify the true statement with respect to 'Unclaimed Dividend' and redemption amounts in mutual fund schemes.", "opts": ["The Asset Management Company can charge a penalty from the investors to refund the unclaimed dividend", "The Asset Management Company can recover investment management fees from the investor but within the prescribed rates", "The Asset Management Company has to transfer the unclaimed amounts to investor education fund", "All of the above"], "ans": "The Asset Management Company can recover investment management fees from the investor but within the prescribed rates", "exp": "Unclaimed dividends/redemptions are kept aside by the AMC. They can be invested and AMCs may deduct management fees (within SEBI rules). As per SEBI rules - The mutual fund has to deploy unclaimed dividend and redemption amounts in the money market and in a separate plan of Liquid scheme floated by mutual funds especially for investing the unclaimed amounts. AMC can recover investment management and advisory fees on management of these unclaimed amounts, at a maximum rate of 0.50 percent per annum and there shall be no exit loads charged on this plan."}, {"n": 32, "q": "Mr. Prakash has made an one time investment in a mutual fund scheme through a distributor. He has done no other subsequent transactions. How will the trail commission payable to the distributor be calculated ?", "opts": ["The NAV as on the date of purchase X Number of units X Rate of trail commission X Number of days the investment is held / 365", "The NAV as on the date of calculation of trail commission X Number of units X Rate of trail commission X Number of days the investment is held / 365", "Average of all NAVs from the date of purchase to the date of calculation of trail commission X Number of units X Rate of trail commission X Number of days the investment is held / 365", "Face value of unit X Number of units X Rate of trail commission X Number of days the investment is held / 365"], "ans": "The NAV as on the date of calculation of trail commission X Number of units X Rate of trail commission X Number of days the investment is held / 365", "exp": "Trail commission is calculated as a percentage of the net assets attributable to the Units sold by the distributor. The commission payable is calculated on the daily balances and paid out periodically to the distributor as per the agreement entered into with AMC. As the trail commission is calculated on net assets, distributors benefit from increase in net assets arising out of valuation gains in the market. The formula for calculating the trail commission for a day is : Value of Net Assets as on the date of calculating trail commission x Trail commission Rate  / 365 Trail commission for each day is added to get the total trail commission for a period. Value of net assets for the day will be the Number of Units held x the NAV of the day."}, {"n": 33, "q": "The information which is provided in a mutual fund advertisement has to be _______ .", "opts": ["Published in one English and one regional language newspaper", "Approved by Securities and Exchange Board of India", "Timely", "Valid for at least 6 months investment horizon"], "ans": "Timely", "exp": "As per the SEBI Advertisement Code for Mutual Funds - Advertisements shall contain information that is timely and consistent with the disclosures made in the Scheme Information Document, Statement of Additional Information and the Key Information Memorandum. (No approval is required from SEBI except - Prior approval of SEBI shall be required for issuance of any endorsement of Mutual Funds as a financial product, which features a celebrity for the purpose of increasing awareness of Mutual Funds)"}, {"n": 34, "q": "Which of these expenses can be charged to a mutual fund scheme by the AMC ?", "opts": ["Office salaries of fund management team", "Rent of the AMC registered office", "AMC general administration expenses", "Custodian and Fund Administrator fees"], "ans": "Custodian and Fund Administrator fees", "exp": "In addition to the investment and advisory fee, the AMC may charge the mutual fund scheme with recurring expenses including: - marketing and selling expenses including agents’ commission, if any - brokerage and transaction cost - registrar services for transfer of units sold or redeemed - fees and expenses of trustees - audit fees - custodian fees etc."}, {"n": 35, "q": "Which is the Source Scheme in a Systematic Transfer Plan ?", "opts": ["It is the scheme with the lower NAV", "It is the scheme from which funds are transferred", "It is the scheme to which funds are transferred", "It is the scheme with the higher NAV"], "ans": "It is the scheme from which funds are transferred", "exp": "In a Systematic Transfer Plan (STP), the amount that is withdrawn from a scheme (called the source scheme) is re-invested in some other scheme (called the target scheme) of the same mutual fund. For eg. An investor has invested Rs 50,000 in SBI Debt Fund and has a STP to transfer Rs 5000 every month into SBI Mid Cap Fund. Here SBI Debt Fund is the Source fund and SBI Mid Cap Fund is the Target fund."}, {"n": 36, "q": "Identify the FALSE statement/s with respect to a New Fund Offer (NFO). 1. A Closed-ended mutual fund NFO will have a NFO opening date, a NFO closing date and a scheme Re-opening date 2. A Open-ended mutual fund NFO will have a NFO opening date, a NFO closing date and a scheme Re-opening date", "opts": ["Only 1 is false", "Only 2 is false", "Both 1 and 2 are false"], "ans": "Only 1 is false", "exp": "Closed-ended mutual funds typically do not have a scheme re-opening date, as they are not open for continuous subscription and redemption. Once the NFO period is over, investors can buy or sell units on the stock exchange, but the fund is not open for fresh subscriptions . On the other hand, open-ended mutual funds usually re-open for subscription after the NFO period, allowing investors to buy or sell units at the prevailing Net Asset Value (NAV) Therefore, only statement 1 is false."}, {"n": 37, "q": "Which of these information is not contained in the Scheme Information Document (SID)?", "opts": ["Names of securities in the scheme's portfolio", "Investment objective of the scheme", "Risk factors of the scheme", "Portfolio features"], "ans": "Names of securities in the scheme's portfolio", "exp": "The names of securities in the scheme's portfolio is contained in the Fund fact sheet and not in the SID."}, {"n": 38, "q": "Opening of time stamping machine needs to be documented and reported to the Asset Management Company (AMC) - State whether True or False?", "opts": ["True", "False"], "ans": "False", "exp": "The points of acceptance for mutual fund transactions have time stamping machines with tamper-proof seal. Opening the machine for repairs or maintenance is permitted only by vendors or nominated persons of the mutual fund. Such opening of the machine has to be properly documented and reported to the Trustees."}, {"n": 39, "q": "Identify the INCORRECT statement with respect to SEBI Complaints Redress System (SCORES).", "opts": ["SCORES enables the market intermediaries and listed companies to receive complaints from investors, redress such complaints and report redressal", "SCORES is a web-based centralized grievance redress system", "SCORES is completely online, so an investor cannot lodge a physical compliant", "If an investor lodges a physical complaint then such complaints are scanned and then uploaded in SCORES for processing"], "ans": "SCORES is completely online, so an investor cannot lodge a physical compliant", "exp": "While SCORES is primarily online, investors can still submit physical complaints to the SEBI office or concerned intermediary. These physical complaints are then scanned and uploaded onto SCORES for further processing. Therefore - 'SCORES is completely online, so an investor cannot lodge a physical compliant'  - is incorrect."}, {"n": 40, "q": "Identify the FALSE statement/s with respect to benchmarks for mutual fund schemes. A. A Multi-Cap fund can have Nifty 500 index as its benchmark B. A Multi-Cap fund can have BSE Sensex as its benchmark", "opts": ["Only A is false", "Only B is false", "Both A and B are false", "None of the above"], "ans": "Only B is false", "exp": "A Multi-Cap fund invests in Large Cap, Mid Cap and Small Cap stocks as per proportions stipuated by SEBI. The Nifty500 index represents top 100 large cap companies, top 150 Mid-cap companies and top 250 small cap companies. Therefore, it can be a good benchmark for a Multi-Cap fund. The BSE Sensex has 30 large cap stocks from various sectors and it can be good benchmark for a large cap fund and not for a multi cap fund."}, {"n": 41, "q": "Identify the TRUE statement/s with respect to the risks associated with short selling and stock lending. 1. There is counterparty risk and liquidity risk in short selling 2. There is no risk associated with stock lending as the transaction is done through an approved intermediary", "opts": ["Only 1 is true", "Only 2 is true", "Both 1 and 2 are true"], "ans": "Only 1 is true", "exp": "Short-selling is the sale of shares or securities that the seller does not own at the time of trading. Instead, he borrows it from someone who already owns it. Later, the short seller buys back the stock/security he shorted and returns the stock/security to the lender to close out the loan. The inherent risks are Counterparty risk and liquidity risk of the stock/security being borrowed. The security being short sold might be illiquid or become illiquid and covering of the security might occur at a much higher price level than anticipated, leading to losses. Securities Lending is lending of securities through an approved intermediary to a borrower under an agreement for a specified period with the condition that the borrower will return equivalent securities of the same type or class at the end of the specified period along with the corporate benefits accruing on the securities borrowed. There are risks inherent in securities lending, including the risk of failure of the other party. Such failure can result in a possible loss of rights to the collateral, the inability of the approved intermediary to return the securities deposited by the lender and the possible loss of corporate benefits accruing thereon."}, {"n": 42, "q": "Mr. Suresh invests Rs 30000 in an equity fund. The face value of this scheme is Rs 10 and the NAV is Rs 12. The exit load is 2%. How many units will be allotted to Mr. Suresh ?", "opts": ["3000", "2142.8571", "2500", "2411.1574"], "ans": "2500", "exp": "Exit load is not applicable on purchase of units. Its applicable only on sale of units. The units will be allotted to Mr. Suresh as per the NAV which is Rs. 12. Amount invested is Rs 30,000 Units allotted = Amount Invested / NAV = 30000 / 12 = 2500"}, {"n": 43, "q": "Amongst the distribution channel mentioned below, which one is likely to sell funds of only a single mutual fund house?", "opts": ["Distribution Company", "Independent financial advisor", "Institutional sales team of the Asset Management Company", "Bank"], "ans": "Institutional sales team of the Asset Management Company", "exp": "An independent financial advisor, a bank or a distribution company will sell mutual fund schemes of various mutual fund houses as per their clients  requirements and other considerations. However, an institutional sales team of an Asset Management Company will sell schemes only of the single mutual fund house which has appointed it."}, {"n": 44, "q": "These debt mutual funds have been arranged from lowest risk to highest risk. Identify the risk which we are discussing : 1. Liquid Funds 2. Money market funds 3. Medium term bond funds", "opts": ["Interest Rate Risk", "Concentration Risk", "Default Risk", "Credit Risk"], "ans": "Interest Rate Risk", "exp": "Interest rate risk is the risk that an investment's value will change as a result of a change in interest rates. The interest rate risk varies for bonds with different maturities. Those with longer maturity would witness higher price fluctuations in comparison to those with shorter maturities. Similarly short term debt funds will have lower interest rate risk when compared to longer term debt funds. In the above question, Liquid funds have the shortest duration and so will have less adverse effect of interest rate risk when compared to Money market funds and Medium term bond funds."}, {"n": 45, "q": "Which of these funds will generally have a higher fund management cost?", "opts": ["Debt Fund", "Active Equity Fund", "Passive Equity Fund", "Equity Index Fund"], "ans": "Active Equity Fund", "exp": "In Active Equity Funds the fund manager does a lot of buying / selling which result in higher transaction costs. Also a lot of research work goes into it. So the cost of fund management are higher. Equity Index Funds or Passive Equity funds invest in a portfolio that mimics a market index. There is no selection risk in index funds because the fund manager has no role in creating the portfolio. For this reason, the costs that an index fund is allowed to charge is also lower since there are no research or other fund management expenses."}, {"n": 46, "q": "SEBI Complaint Redress System (SCORES) helps an investor to ______ . 1. Lodge a complaint for a grievance 2. Make a follow-up on the complaint 3. Track the status of redressal of such complaints online", "opts": ["Only 1", "Only 1 and 3", "Only 1 and 2", "All 1, 2 and 3"], "ans": "All 1, 2 and 3", "exp": "SEBI Complaint Redress System (SCORES) is a web-based centralized grievance redress system of SEBI. SCORES enables investors to lodge, follow up on their complaints and track the status of redressal of such complaints online on the website - http://scores.gov.in"}, {"n": 47, "q": "Among equity funds, Focused funds carry _______ risks as compared to diversified funds due to ______ .", "opts": ["Lower ; highly concentrated portfolio", "Higher ; highly concentrated portfolio", "Lower ; lower expenses of the fund", "Higher ; investments in debt securities"], "ans": "Higher ; highly concentrated portfolio", "exp": "Among the equity funds, some schemes may have a portfolio concentrated in a few stocks. Such scheme category is known as “Focused funds”. . These schemes carry higher risk than a diversified fund, due to higher concentration among smaller number of stocks."}, {"n": 48, "q": "Which debt schemes of mutual funds invest only in debt securities where moneys will be repaid within 91 days?", "opts": ["Money Market Funds", "Medium term debt funds", "Fixed Maturity Plans", "Liquid Funds"], "ans": "Liquid Funds", "exp": "Liquid Funds invest in debt and money market instruments with a maturity of up to 91 days. These are considered relatively low-risk and highly liquid among debt mutual funds."}, {"n": 49, "q": "Identify the false statement/s : A. While evaluating the mutual fund schemes, the expense ratio matters more in debt funds than equity funds B. An Ultra-short term debt fund has to mandatorily invest in high credit quality debt securities", "opts": ["Only A is false", "Only B is false", "Both A and B are false"], "ans": "Only B is false", "exp": "Any cost is a drag on investor’s returns. Investors need to be particularly careful about the cost structure of debt schemes, because in the normal course, debt returns can be much lower than equity schemes. So expense ratio is more critical for debt funds. When the limits are not tightly defined, the fund manager may assume an active role in managing the risk, e.g. an ultra-short term debt fund may take credit risk, since the SEBI regulations only define the permitted maturity profile, which indicates how much interest rate risk the scheme can take."}, {"n": 50, "q": "Identify the TRUE statement - A. It is mandatory for the AMC to disclose the valuation policy B. The AMC is not accountable for policies and procedures for detecting and preventing incorrect valuation", "opts": ["Only A is true", "Only B is true", "Both A and B are true"], "ans": "Only A is true", "exp": "Disclosure of the valuation policy and procedures approved by the Board of the AMC shall be made in Statement of Additional Information, on the website of the AMC to ensure transparency of valuation norms to be adopted by asset management company. The responsibility of true and fairness of valuation and correct NAV shall be of the Asset Management Company, irrespective of disclosure of the approved valuation policies and procedures."}, {"n": 51, "q": "Performance of a portfolio is influenced by _______ .", "opts": ["Stock Selection", "Investment Policy", "Asset Allocation Strategy", "All of the above"], "ans": "All of the above", "exp": "A portfolio consists of various types of investment products. It is influenced by the investment policy includes the scheme’s asset allocation and investment style. Also equity returns are a function of sector and stock selection which will influence the portfolio performance."}, {"n": 52, "q": "The additional Total Expense Ratio (TER) charged has to be credited back to the Mutual Fund in which of these situations?", "opts": ["When the performance of the mutual fund declines as compared to previous year", "When the inflows from beyond the top 30 cities are redeemed within a period of 1 year from the date of investment.", "When the TER of the mutual fund exceeds the limit specified under the regulations", "All of the above"], "ans": "When the inflows from beyond the top 30 cities are redeemed within a period of 1 year from the date of investment.", "exp": "Mutual funds can charge additional TER if the new inflows are from beyond top 30 cities (subject to some conditions) However, the additional TER on account of inflows from beyond the top 30 cities so charged shall be credited back to the scheme in case the said inflows are redeemed within a period of 1 year from the date of investment."}, {"n": 53, "q": "All transactions of purchase and sale of securities by key personnel of the AMC, who are directly involved in investment operations shall be disclosed to the compliance officer of the member at least on _______ .", "opts": ["Weekly basis", "Monthly basis", "Half-Yearly basis", "Yearly basis"], "ans": "Half-Yearly basis", "exp": "As per the AMFI Code of Ethics - All transactions of purchase and sale of securities by key personnel who are directly involved in investment operations shall be disclosed to the compliance officer of the member at least on half yearly basis and subsequently reported to the Board of Trustees if found having conflict of interest with the transactions of the fund."}, {"n": 54, "q": "Identify the correct statement(s) related to the Statement of Additional Information (SAI). A) The SAI should be updated regularly within three months after the close of every financial year. B) Any material changes must be updated on an ongoing basis and displayed on the websites of both the mutual fund and AMFI.", "opts": ["Only A", "Only B", "Both A and B", "None of the above"], "ans": "Both A and B", "exp": "The Statement of Additional Information (SAI) contains extra details about the mutual fund, such as operational and legal information. SEBI rules require that the SAI be updated regularly within 3 months after the end of each financial year. Any material changes must also be updated immediately and uploaded on the websites of the Mutual Fund and Association of Mutual Funds in India (AMFI)."}, {"n": 55, "q": "Identify the FALSE statement/s : 1. For equity mutual funds schemes which are actively managed (eg. Diversified equity fund/Balance funds), the net asset value need NOT be declared up to 4 decimal points 2. Each mutual fund scheme’s account is combined with the accounts of the Asset Management Company", "opts": ["Only 1 is false", "Only 2 is false", "Both 1 and 2 are false"], "ans": "Only 2 is false", "exp": "Key Accounting and Reporting Requirements for mutual funds : - The accounts of the schemes need to be maintained distinct from the accounts of the AMC. The auditor for the AMC has to be different from that of the schemes. - NAV for equity and balanced funds is to be calculated up to at least 2 decimal places. (and not 4).  NAV is to be calculated up to 4 decimal places in the case of index funds, liquid funds and other debt funds."}, {"n": 56, "q": "A top performing scheme within a category _______ .", "opts": ["Is the best choice for an investor to invest his funds", "may or may not be the top performer in the next years to come", "usually remains the top performer for a long period of time", "usually be the worst performer in the next years to come"], "ans": "may or may not be the top performer in the next years to come", "exp": "As experience has shown time and again, the top performers during one period may not necessarily remain as a top performer forever or near the other top performers. In such a case, simply buying into a scheme due to good returns in the recent past may not be a wise approach. The mutual fund advertisements use the disclaimer: “Past performance may or may not be sustained in future”."}, {"n": 57, "q": "Identify the TRUE statement with respect to ‘Jensen’s Alpha’ of a mutual fund scheme?", "opts": ["It is a measure of outperformance after adjusting for the risk taken", "It is a measure of risk and outperformance is related to returns", "It is a measure of simple outperformance, irrespective of the risk taken", "None of the above"], "ans": "It is a measure of outperformance after adjusting for the risk taken", "exp": "Jensen's Alpha is used to determine the abnormal return of a security or portfolio of securities over the theoretical expected return. It is a risk-adjusted performance measure that represents the average return on a portfolio or investment, above or below that predicted by the capital asset pricing model (CAPM), given the portfolio's or investment's beta and the average market return."}, {"n": 58, "q": "The appropriate benchmark for a short term debt scheme will be _______ .", "opts": ["1 Year T-Bill index", "Nifty50", "10 year dated GoI security", "5 year dated GoI security"], "ans": "1 Year T-Bill index", "exp": "Appropriate Benchmarks : Equity scheme  -  Sensex or Nifty Long term debt scheme - 10 year dated GoI security Short-term debt fund -  1 year T-Bill"}, {"n": 59, "q": "As per SEBI guidelines, _________ is/are vested with the responsibility of developing indices as benchmark for debt mutual fund schemes.", "opts": ["AMFI", "The mutual fund themselves", "The risk management department of the AMC's", "Research and rating agencies"], "ans": "Research and rating agencies", "exp": "As per the SEBI guidelines, the benchmark for debt (and balanced schemes) should be developed by research and rating agencies recommended by AMFI. CRISIL, ICICI Securities and NSE have developed various such indices."}, {"n": 60, "q": "SEBI has to approve the Scheme Related Documents in ______ .", "opts": ["7 days", "15 days", "1 month", "SEBI does not approve the Scheme Related Documents. It only gives its observations"], "ans": "SEBI does not approve the Scheme Related Documents. It only gives its observations", "exp": "SEBI does not approve or disapprove the Scheme Related Documents, it gives its observations. The mutual fund needs to incorporate these observations in these documents. Thus, the documents in the market are “vetted” by SEBI, and not approved by SEBI."}, {"n": 61, "q": "______ is an example of physical asset.", "opts": ["Bank Deposit", "Shares and Debentures", "Land and Building", "Futures and Options"], "ans": "Land and Building", "exp": "Land and buildings are physical property. Shares, Debentures, Bank Deposits, F&O are all financial assets/instruments."}, {"n": 62, "q": "Mohit needs Rs. 2,00,000 in 5 years from now. The interest rate is 7%. The amount required today to be invested can be calculated by using the formula ______ .", "opts": ["200000 / (1+0.07)^5", "200000 * (1- 0.07)^5", "200000 / (1+0.07)*5", "200000 * (1+0.07)*5"], "ans": "200000 / (1+0.07)^5", "exp": "The formula for calculating the Future Value of an investment made today is  FV = PV * (1 + r) ^ n Where FV is the future value ; PV is the present value ; r is the rate of inflation or interest rate ; n is the number of years Thus the formula for Present value will be  PV =  FV / (1 + r) ^ n Subsituting the above numbers : PV = 2,00,000 / (1+0.07)^ 5"}, {"n": 63, "q": "SEBI has regulations pertaining to restrictions on the investment policies of mutual fund schemes for ensuring that _____ .", "opts": ["The mutual scheme can improve their ratings over a period of time", "The scheme returns are better than the benchmark returns", "The scheme returns are better than the Nifty/Sensex", "The mutual fund scheme has a minimum diversification as per the requirements"], "ans": "The mutual fund scheme has a minimum diversification as per the requirements", "exp": "The investors have no control, over the investment management of the mutual fund. It is in this context that SEBI has laid down regulations pertaining to investment universe, restrictions and portfolio diversification for investment by mutual fund schemes. Such regulations intend to control the risks taken by the mutual fund managers."}, {"n": 64, "q": "Which exam has to be cleared to get the Employee Unique Identification Number (EUIN) from AMFI?", "opts": ["SEBI - VA Mutual Fund Distributors Certification Examination", "AMFI - VA Mutual Fund Distributors Certification Examination", "NISM - VA Mutual Fund Distributors Certification Examination", "NISM - VB Mutual Fund Distributors Certification Foundation"], "ans": "NISM - VA Mutual Fund Distributors Certification Examination", "exp": "Institutions that are into the distribution of mutual funds need to register with AMFI. The employees of these institutions need to clear the NISM Series V-A: Mutual Fund Distributors Certification Examination and obtain an Employee Unique Identification Number (EUIN) from AMFI."}, {"n": 65, "q": "In the usual course of events, a fund manager will have to provide the maximum liquid assets for _______ .", "opts": ["Gold ETFs", "Equity ETFs", "Close-end fund", "Open-end fund"], "ans": "Open-end fund", "exp": "ETFs and Close-end funds are listed on the stock exchanges and investors can sell their units their. They need not give redemption request to the AMCs. So, the fund manager need not maintain liquid funds for Close-end funds and ETFs. In an open-end fund, investors can buy or redeem units directly from the fund at any time. Therefore, the fund manager needs to maintain higher liquid assets/cash to meet frequent redemption requests. Hence, maximum liquidity is normally required for an Open-end fund."}, {"n": 66, "q": "_______ can be used in lieu of Income distribution cum capital withdrawal pay-outs.", "opts": ["Systematic Investment Plan", "Systematic Transfer Plan", "Systematic Withdrawal Plan", "All of the above"], "ans": "Systematic Withdrawal Plan", "exp": "The Income distribution cum capital withdrawal (dividend) pay-out option is for investors wanting a regular income. Systematic Withdrawal Plan(SWP) is a facility which allows an investor to withdraw a fixed amount at pre-determined intervals. Therefore an Income distribution cum capital withdrawal (dividend) pay-out option is similar to SWP. The difference is that the dividend is paid only when the fund has a surplus amount and in SWP the amount is compulsarily paid. (The dividend pay-out plan is renamed as pay-out of income
