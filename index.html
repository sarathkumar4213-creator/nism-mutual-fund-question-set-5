<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutual Fund — Question Set 5</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:900px;margin:auto;padding:18px}.top{position:sticky;top:0;background:#fff;padding:14px 16px;border-radius:14px;box-shadow:0 3px 15px #0001;z-index:5}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.timer{font-size:24px;font-weight:800}.danger{color:#b42318}.progress{height:8px;background:#e7ebf2;border-radius:99px;margin-top:12px;overflow:hidden}.fill{height:100%;width:0;background:#2563eb}.card{background:#fff;border-radius:16px;padding:24px;margin-top:18px;box-shadow:0 4px 18px #0000000d}.qno{font-weight:700;color:#2563eb}.q{font-size:20px;line-height:1.5;font-weight:700;margin:10px 0 20px;white-space:pre-wrap}.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border:2px solid #dbe2ec;border-radius:12px;background:#fff;font-size:16px;cursor:pointer}.opt:hover{border-color:#2563eb}.opt.correct{background:#ecfdf3;border-color:#16a34a}.opt.wrong{background:#fef2f2;border-color:#dc2626}.feedback{padding:14px;border-radius:12px;margin-top:16px;line-height:1.55}.good{background:#ecfdf3;color:#166534}.bad{background:#fef2f2;color:#991b1b}.explain{background:#f8fafc;padding:14px;border-radius:12px;margin-top:12px;line-height:1.6;white-space:pre-wrap}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.next{background:#2563eb;color:#fff}.end{background:#fee2e2;color:#991b1b}.start{background:#2563eb;color:#fff}.hidden{display:none}.result{text-align:center}.score{font-size:42px;font-weight:800;margin:12px}.small{color:#667085;font-size:14px}</style></head><body><div class="wrap"><div class="top"><div class="bar"><div><b>Mutual Fund — Question Set 5</b><div class="small" id="progressText">Ready</div></div><div class="timer" id="timer">00:00</div></div><div class="progress"><div class="fill" id="fill"></div></div></div><div id="start" class="card" style="padding:0;overflow:hidden">
<div style="padding:26px 24px;background:linear-gradient(135deg,#173b7a,#2456a6);color:#fff"><h1 style="margin:0 0 8px;font-size:26px">NISM VD — Mutual Fund</h1><div style="font-size:17px;opacity:.95">Practice Question Sets</div></div>
<div style="padding:22px 24px"><div style="overflow:auto;border:1px solid #e2e8f0;border-radius:12px"><table style="width:100%;border-collapse:collapse;min-width:620px"><thead><tr style="background:#f1f5f9"><th style="padding:13px;text-align:left">Sr. No.</th><th style="padding:13px;text-align:left">Test</th><th style="padding:13px;text-align:center">Total Questions</th><th style="padding:13px;text-align:center">Online</th></tr></thead><tbody><tr><td style="padding:14px;border-top:1px solid #e2e8f0">5</td><td style="padding:14px;border-top:1px solid #e2e8f0;font-weight:700">PRACTICE Qs ON MUTUAL FUNDS — SET 5</td><td style="padding:14px;border-top:1px solid #e2e8f0;text-align:center">70</td><td style="padding:14px;border-top:1px solid #e2e8f0;text-align:center"><button class="btn start" onclick="startExam()">Start Test</button></td></tr></tbody></table></div><div style="margin-top:20px;background:#f8fafc;border-radius:12px;padding:16px;line-height:1.6"><b>Exam format</b><br>70 questions • No fixed time limit • Timer starts at 00:00 and counts upward • End the exam anytime • 1 mark per correct answer</div></div></div><div id="quiz" class="hidden"></div><div id="result" class="card result hidden"></div></div><script>const questions=[{"n": 1, "q": "A Systematic Transfer Plan (STP) is essentially a combination of which of the following ?", "opts": ["A one-time investment followed by a one-time redemption between two mutual fund schemes", "Multiple purchases followed by multiple redemptions within the same mutual fund scheme", "A lump sum investment followed by periodic redemptions between two mutual fund schemes", "A Systematic Withdrawal Plan (SWP) and a Systematic Investment Plan (SIP) occurring simultaneously between two mutual fund schemes"], "ans": "A Systematic Withdrawal Plan (SWP) and a Systematic Investment Plan (SIP) occurring simultaneously between two mutual fund schemes", "exp": "A Systematic Transfer Plan (STP) allows investors to move money at regular intervals from one mutual fund scheme (usually a debt or liquid fund) to another (often an equity fund). It works like a Systematic Withdrawal Plan (SWP) from the source scheme and a Systematic Investment Plan (SIP) into the target scheme, happening together. Both these actions happen simultaneously and automatically, making STP essentially a SWP + SIP combo running together between two schemes."}, {"n": 2, "q": "Which of the following is mandatory for a distributor to become empaneled with an AMC?", "opts": ["More than 10 years of mutual fund distribution experience", "Registration with SEBI", "Completion of KYC formalities", "Completion of the Know Your Distributor (KYD) process"], "ans": "Completion of the Know Your Distributor (KYD) process", "exp": "Before empanelment with mutual funds or AMCs, mutual fund distributors must complete the Know Your Distributor (KYD) process. The KYD process involves verification of the distributor's identity, address, bank details, and AMFI Registration Number (ARN) — ensuring that only genuine and verified intermediaries are allowed to distribute mutual funds. A SEBI registration is not required for MF distributors — they operate under an ARN (AMFI Registration Number) issued by AMFI."}, {"n": 3, "q": "Which of the following best describes the concept of Asset Allocation?", "opts": ["Choosing how many mutual fund schemes an investor should hold", "Determining which asset class will generate superior returns", "Allocating money among various asset categories according to financial objectives, present financial condition and risk appetite", "All of the above"], "ans": "Allocating money among various asset categories according to financial objectives, present financial condition and risk appetite", "exp": "Asset Allocation is a fundamental investment strategy that involves dividing an investment portfolio across different asset classes such as equity, debt, gold, real estate, and cash equivalents. The allocation is not random — it is carefully determined based on three key personal factors: the investor's financial goals (retirement, child's education, etc.), current financial situation (income, liabilities, time horizon), and risk profile (conservative, moderate, or aggressive)."}, {"n": 4, "q": "What change regarding Dividend Distribution Tax (DDT) was introduced in the Union Budget 2020?", "opts": ["DDT was abolished for all categories of mutual fund schemes", "The DDT rate was reduced, but the tax continued to apply", "DDT was removed only for equity-oriented mutual fund schemes, while continuing for non-equity schemes", "DDT was removed only for non-equity mutual fund schemes, while continuing for equity-oriented schemes"], "ans": "DDT was abolished for all categories of mutual fund schemes", "exp": "In the Union Budget 2020, the Government abolished Dividend Distribution Tax (DDT) on mutual funds. Earlier, mutual fund companies paid DDT before distributing dividends to investors. After abolition, dividend income became taxable directly in the hands of investors according to their income tax slab."}, {"n": 5, "q": "Which of the following indicates that a scheme does not benefit from economies of scale?", "opts": ["Net Asset Value (NAV)", "Small fund size", "Cost of fund management", "None of the above"], "ans": "Small fund size", "exp": "Economies of scale mean that larger funds can spread their expenses over more assets, reducing cost per investor. Such large funds spread costs across many investors, lowering expenses. A smaller fund size does not get this benefit because expenses are spread over a lower asset base, so costs per investor stay high. This means smaller fund size prevents economies of scale."}, {"n": 6, "q": "Which document contains details such as minimum investment requirements, investor service center locations, and the process for purchasing mutual fund units?", "opts": ["Fund Factsheet", "Application form", "Key Information Memorandum", "Transaction slip"], "ans": "Key Information Memorandum", "exp": "The Key Information Memorandum (KIM) contains essential details about a mutual fund scheme in a simple and summarized form. It includes information such as minimum investment amount, investor service centres, purchase procedure, and other important scheme details. The KIM helps investors quickly understand the scheme before investing."}, {"n": 7, "q": "An application submitted for repurchase of mutual fund units is stamped with __________ . A) ARN number of the distributor B) Automatically generated location code C) Machine identifier", "opts": ["A and B", "B and C", "A and C", "All A, B and C"], "ans": "B and C", "exp": "As per mutual fund transaction processing rules, repurchase applications are stamped with an automatically generated location code and machine identifier. These details help in proper time-stamping and tracking of transactions for NAV applicability and audit purposes. ARN of the distributor is not part of the mandatory stamping requirement on repurchase applications."}, {"n": 8, "q": "Identify the correct statement(s) related to risk in mutual fund schemes: A) Credit Risk Funds generally carry a higher default risk compared to Corporate Bond Funds B) The NAV of gilt funds may fluctuate significantly more than liquid funds because of changes in market yields", "opts": ["Only A", "Only B", "Both A and B", "None of the above"], "ans": "Both A and B", "exp": "Credit Risk Funds chase higher returns by investing in lower-rated bonds (below AA) — this means the companies issuing these bonds have a higher chance of defaulting on repayment.  Corporate Bond Funds stick to high quality AA+ and above rated bonds — much safer but with slightly lower returns. So, Credit Risk Funds have a higher default risk than Corporate Bond Funds. Gilt funds invest in long-term government bonds (sometimes 10–30 year maturity). When interest rates/yields rise, the prices of these bonds fall sharply — causing significant NAV fluctuation. Liquid funds invest in instruments maturing within 91 days, so yield changes barely affect their NAV."}, {"n": 9, "q": "Investments held in a mutual fund portfolio are valued at:", "opts": ["Book value", "Face value", "Market value", "Cost price"], "ans": "Market value", "exp": "Mutual fund investments are valued using their current market price. This helps calculate the correct Net Asset Value (NAV) of the scheme every day. Face value, book value, or purchase cost may not reflect the current worth of the securities. Therefore, mutual fund portfolios are valued at market value."}, {"n": 10, "q": "The interest rate sensitivity of a mutual fund scheme having a longer average maturity is generally:", "opts": ["High", "Medium", "Moderate", "Low"], "ans": "High", "exp": "Interest rate sensitivity refers to how much the price of a bond or debt fund changes when interest rates move. Mutual funds with long average maturity hold long-term bonds, which have higher duration. Duration is the key measure of sensitivity. This is because the fund is locked into current interest rates for a longer period, making it more vulnerable to rate fluctuations. When interest rates rise, the prices of these long-term bonds fall more sharply, leading to greater volatility in the fund’s NAV. Conversely, if interest rates decline, such funds benefit more, as bond prices rise significantly. Hence, investors in long maturity debt funds face higher risk and reward potential compared to short maturity funds."}, {"n": 11, "q": "Which of the following statements correctly reflects SEBI guidelines regarding Income Distribution cum Capital Withdrawal (IDCW), formerly known as dividends, in mutual fund schemes?", "opts": ["IDCW can be paid only from dividends earned by the scheme from its investments", "IDCW may be distributed only out of distributable reserves", "IDCW may be distributed only if the current NAV exceeds Rs. 10", "Mutual fund schemes are prohibited from distributing IDCW to unit holders"], "ans": "IDCW may be distributed only out of distributable reserves", "exp": "As per SEBI guidelines, mutual fund schemes can distribute IDCW only from distributable surplus/reserves available in the scheme. Which means only from realized profits and surplus available in the scheme. The fund cannot distribute more than what it has earned and realized — preventing any artificial or funded payouts. IDCW is not guaranteed and depends on the availability of distributable reserves. It is not necessary that NAV should be above Rs. 10 for paying IDCW. Also, IDCW is not restricted only to dividends received from invested companies."}, {"n": 12, "q": "Identify the true statement(s) regarding arbitrage funds: A) Arbitrage funds are riskier compared to equity mutual funds B) Arbitrage funds aim to exploit price inefficiencies between different market segments", "opts": ["Statement A only", "Statement B only", "Both statements A and B", "None of the above"], "ans": "Statement B only", "exp": "Statement B is true :  Arbitrage funds try to earn profit from price differences of the same security in different markets, such as cash and futures markets. It works on very simple principle — \"Buy Low in one market, Sell High in another market simultaneously.\" Statement A is false :  Since every position is hedged (covered), the risk is actually very low — much lower than regular equity funds. Therefore, arbitrage funds generally have lower risk than equity funds since positions are usually hedged."}, {"n": 13, "q": "At what stage does a nominee become entitled to have mutual fund units transferred in their name ?", "opts": ["Once the nomination is made by the unit holders", "Once the nomination is registered by the mutual fund", "Upon the death of the first unit holder", "Upon the death of all unit holders"], "ans": "Upon the death of all unit holders", "exp": "In a jointly held mutual fund account, if the first holder passes away, the surviving joint holders automatically continue to hold the units. The nominee’s right arises only when no registered holder remains alive."}, {"n": 14, "q": "Which among the following statements about real estate investments is NOT true?", "opts": ["The ticket size for investing in real estate is usually higher compared to financial investments", "Real estate investments are illiquid and cannot be readily converted into cash in a few days at a clear market price", "Real estate transactions generally carry lower costs than investments in financial assets", "All of the above"], "ans": "Real estate transactions generally carry lower costs than investments in financial assets", "exp": "Real estate investments involve very high transaction costs — including stamp duty, registration charges, brokerage fees, legal charges, and maintenance costs. Therefore the statement - 'Real estate transactions generally carry lower costs than investments in financial assets' is false. The other two statements are true — real estate is indeed illiquid (cannot be sold quickly at a fair price within days), and the ticket size is very high (you need lakhs or crores to invest, unlike mutual funds where you can start with Rs. 500)."}, {"n": 15, "q": "What is the NAV if the value of stocks in a Mutual Fund scheme is Rs 100 cr, Value of Bonds is Rs 10 cr, Value of Money Market Instruments is Rs 25 cr, Dividend Accrued but not received is Rs 3 cr and Fees payable is Rs 5 cr. The number of outstanding units is 75 lacs.", "opts": ["173.33", "177.33", "184", "186.74"], "ans": "177.33", "exp": "NAV = (Value of stocks + Value of bonds + Value of money market instruments + Dividend accrued but not received  – Fees payable) / No. of outstanding units = 100 cr + 10 cr + 25 cr + 3 cr - 5 cr  /  75 lacs (75 lacs = 0.75 cr) = 133 cr / 0.75 cr = 177.33"}, {"n": 16, "q": "Identify the transactions on which Securities Transaction Tax (STT) is applicable", "opts": ["Purchase transactions of debt mutual funds", "Purchase transactions of equity mutual funds", "Redemption transactions of debt mutual funds", "Redemption transactions of equity mutual funds"], "ans": "Redemption transactions of equity mutual funds", "exp": "When an investor sells units of an equity fund in the stock exchange, or offers them for repurchase to the fund, he will have to incur Securities Transaction Tax (STT) i.e., STT is applicable only on redemption/switch to other schemes/sale of units of equity oriented mutual funds whether sold on stock exchange or otherwise. STT is not applicable on purchase of units of an equity scheme. It is also not applicable to transactions in debt securities or debt mutual fund schemes."}, {"n": 17, "q": "Identify the TRUE statement with respect to regulation of mutual funds in India.", "opts": ["AMFI along with SEBI regulates the mutual funds in India", "The two stock exchanges NSE and BSE regulate the open-end mutual fund schemes", "SEBI regulates the mutual funds in India", "RBI along with SEBI regulate the bank sponsored mutual funds in India"], "ans": "SEBI regulates the mutual funds in India", "exp": "Securities markets in India are regulated by the Securities and Exchange Board of India (SEBI). It regulates, among other entities, mutual funds, depositories, custodians, registrars and transfer agents (RTAs) and credit rating agencies in the country. AMFI does not regulate the Mutual Fund. The objectives of AMFI are to define and maintain high professional and ethical standards in all areas of operation of the mutual fund industry."}, {"n": 18, "q": "Identify which of these is not included in the 'Fundamental Attributes' of a mutual fund scheme?", "opts": ["Aggregate fees and expenses charged to the scheme", "Any safety net or guarantee provided", "Exit Loads", "Liquidity provisions such as listing, repurchase, redemption"], "ans": "Exit Loads", "exp": "Within the Scheme Information Document, there is an important section on fundamental attributes of a scheme with following parameters on terms of issue : Terms of Issue - 1. Liquidity provisions such as listing, repurchase, redemption. 2. Aggregate fees and expenses charged to the scheme. 3. Any safety net or guarantee provided. Exit Loads do not form a part of 'Fundamental Attributes' of a scheme."}, {"n": 19, "q": "Tactical Asset Allocation is the decision that comes out of calls on the likely behaviour of the market - True or False ?", "opts": ["False", "True"], "ans": "True", "exp": "Tactical Asset Allocation is the decision that comes out of calls on the likely behaviour of the market. An investor who decides to go overweight on equities because of expectations of a rise in share markets, is taking a tactical asset allocation call."}, {"n": 20, "q": "What will be the minimum investment in corporate bonds (AA and below rated) in a Credit Risk fund?", "opts": ["50% of of total assets", "55% of of total assets", "60% of of total assets", "65% of of total assets"], "ans": "65% of of total assets", "exp": "Credit Risk Fund is an open-ended debt scheme investing in below highest rated corporate bonds. The minimum investment in corporate bonds shall be 65 percent of total assets (only in AA (excludes AA+ rated corporate bonds) and below rated corporate bonds)."}, {"n": 21, "q": "The Market Value of stocks of a scheme is Rs 240 crores. Dividend accrued but not received is Rs 30 crore. The Expenses payable are Rs 10 crore. The total number of outstanding units is 120 lakhs. What is the NAV of the scheme ?", "opts": ["175.80", "216.66", "224.70", "311.74"], "ans": "216.66", "exp": "Total Market Value = Rs 240 crore Add Dividend Accrued of Rs 30 crore Less Expenses Payable of Rs 10 crore Divided by Units 120 lakhs ie. 1.20 crore units 260 cr / 1.2 cr  = 216.66 NAV"}, {"n": 22, "q": "The _______ is the promoter of a Mutual Fund.", "opts": ["Trust", "AMC", "Sponsor", "Custodian"], "ans": "Sponsor", "exp": "Mutual funds are constituted as Trusts. The mutual fund trust is created by one or more Sponsors, who are the main persons behind the mutual fund business."}, {"n": 23, "q": "Identify the CORRECT statement.", "opts": ["Mutual funds can only be purchased on the stock exchange platform and they cannot be sold", "All mutual funds purchased on the stock exchange platform have a mandatory lock-in period", "Stock exchange mutual fund trading platform has become another channel for mutual fund companies to reach out to investors", "All of the above"], "ans": "Stock exchange mutual fund trading platform has become another channel for mutual fund companies to reach out to investors", "exp": "SEBI has facilitated buying and selling of the units of open-ended mutual funds through the stock exchanges. Both National Stock Exchange (NSE) and Bombay Stock Exchange (BSE) have extended their trading platforms to help the stock exchange brokers become a channel for investors to transact in Mutual Fund units."}, {"n": 24, "q": "Once the New Fund Offer (NFO) of a Close Ended Fund has closed, a person can buy the listed units of such close ended fund ____________.", "opts": ["At prices usually higher than NAV", "At prices usually lower than NAV", "At prices which can be higher or lower than NAV", "Units of a Close Ended Fund cannot be bought after NFO"], "ans": "At prices which can be higher or lower than NAV", "exp": "After the NFO of a close ended fund, sale and purchase transactions happen on the stock exchange between two different investors, and that the fund is not involved in the transaction. The transaction price is likely to be different from the NAV. Depending on the demand-supply situation for the units of the scheme on the stock exchange, the transaction price could be higher or lower than the prevailing NAV."}, {"n": 25, "q": "________ is prohibited as per the AMFI Code of Ethics.", "opts": ["Inter-Scheme transfer of securities", "Front running in those securities in which the mutual fund is dealing", "Transaction in securities through associated brokers", "Distribution of mutual fund schemes through Sponsor or its associates"], "ans": "Front running in those securities in which the mutual fund is dealing", "exp": "Front running means buying or selling of any securities ahead of transaction of the fund, with access to information regarding the transaction which is not public and which is material to making an investment decision, so as to derive unfair advantage. As per the AMFI code of ethics  - Members or any of their directors, officers or employees shall not indulge in front running."}, {"n": 26, "q": "Mohit is currently studying but wants to start a business after 5 years. The present cost of starting such a business is Rs. 10 lakhs. The inflation in the economy is 9%. Which formula should be used to calculate the amount which Mohit will need 5 years down the line?", "opts": ["10,000,00 * (1+0.09)^5", "10,000,00 / (1+0.09)^5", "10,000,00 * (1+0.09)*5", "10,000,00 * (1*0.09)^5"], "ans": "10,000,00 * (1+0.09)^5", "exp": "The formula for calculating the Future Value of an investment made today is  FV = PV * (1 + r) ^ n The PV ie. Present Value is Rs. 10 lakhs. The inflation rate (r) is 9% ie. 0.09 and time (n) is 5 years Subsituting in the formula : FV = 10,000,00 * (1+0.09)^5"}, {"n": 27, "q": "What will happen to the scheme’s Net Asset Value (NAV) after the dividend is paid?", "opts": ["The NAV will Rise", "The NAV will Fall", "The NAV will remain same"], "ans": "The NAV will Fall", "exp": "In a mutual fund, dividend is paid out of the scheme’s assets. Once the dividend is distributed, that amount is deducted from the scheme’s NAV. So, immediately after the dividend payout, the NAV falls by the dividend amount."}, {"n": 28, "q": "Identify the plan which could be used in lieu of income distribution cum capital withdrawal pay-outs?", "opts": ["Systematic Withdrawal Plan", "Systematic Transfer Plan", "Systematic Investment Plan", "None of the above"], "ans": "Systematic Withdrawal Plan", "exp": "The Income distribution cum capital withdrawal (dividend) pay-out option is for investors wanting a regular income. Systematic Withdrawal Plan(SWP) is a facility which allows an investor to withdraw a fixed amount at pre-determined intervals. Therefore an Income distribution cum capital withdrawal (dividend) pay-out option is similar to SWP. The difference is that the dividend is paid only when the fund has a surplus amount and in SWP the amount is compulsarily paid. (The dividend pay-out plan is renamed as pay-out of income distribution cum capital withdrawal, dividend re-investment plan is renamed as reinvestment of income distribution cum capital withdrawal option followed by renaming of dividend transfer plan to transfer of income distribution cum capital withdrawal plan)"}, {"n": 29, "q": "Can an investor change his mutual fund distributor?", "opts": ["Yes, but a permission from AMFI and SEBI is needed for the same", "Yes, but the investor has to give a written request to the fund house", "Yes, but an upfront fees have to be paid to the existing distributor to cover up his loss of income", "No, a change of distributor is not permitted by SEBI"], "ans": "Yes, but the investor has to give a written request to the fund house", "exp": "Investors can choose to change their distributor or opt for direct investing. This needs to be done through a written request by the investor to the AMC. In such cases, AMCs will need to comply, without insisting on any kind of ‘No Objection Certificate’ from the existing distributor."}, {"n": 30, "q": "Identify the CORRECT statement with respect to a Fund Factsheet.", "opts": ["A Fund Factsheet has to be published only at the time of a New Fund Offer (NFO)", "As per SEBI regulations, a Fund Factsheet has to be published on a monthly basis by the AMCs", "A Fund Factsheet is published by AMCs on a voluntary basis", "All mutual fund distributors have to mandatorily read the Fund Factsheet before recommending a scheme to their investors"], "ans": "A Fund Factsheet is published by AMCs on a voluntary basis", "exp": "A Fund Factsheet is a document that provides key information about a mutual fund scheme, such as portfolio holdings, asset allocation, and recent performance. SEBI does not legally mandate AMCs to publish a factsheet. However, most AMCs voluntarily publish it (usually monthly) to keep investors informed and improve transparency."}, {"n": 31, "q": "Identify the true statement with respect to 'Unclaimed Dividend' and redemption amounts in mutual fund schemes.", "opts": ["The Asset Management Company can charge a penalty from the investors to refund the unclaimed dividend", "The Asset Management Company can recover investment management fees from the investor but within the prescribed rates", "The Asset Management Company has to transfer the unclaimed amounts to investor education fund", "All of the above"], "ans": "The Asset Management Company can recover investment management fees from the investor but within the prescribed rates", "exp": "Unclaimed dividends/redemptions are kept aside by the AMC. They can be invested and AMCs may deduct management fees (within SEBI rules). As per SEBI rules - The mutual fund has to deploy unclaimed dividend and redemption amounts in the money market and in a separate plan of Liquid scheme floated by mutual funds especially for investing the unclaimed amounts. AMC can recover investment management and advisory fees on management of these unclaimed amounts, at a maximum rate of 0.50 percent per annum and there shall be no exit loads charged on this plan."}, {"n": 32, "q": "Mr. Prakash has made an one time investment in a mutual fund scheme through a distributor. He has done no other subsequent transactions. How will the trail commission payable to the distributor be calculated ?", "opts": ["The NAV as on the date of purchase X Number of units X Rate of trail commission X Number of days the investment is held / 365", "The NAV as on the date of calculation of trail commission X Number of units X Rate of trail commission X Number of days the investment is held / 365", "Average of all NAVs from the date of purchase to the date of calculation of trail commission X Number of units X Rate of trail commission X Number of days the investment is held / 365", "Face value of unit X Number of units X Rate of trail commission X Number of days the investment is held / 365"], "ans": "The NAV as on the date of calculation of trail commission X Number of units X Rate of trail commission X Number of days the investment is held / 365", "exp": "Trail commission is calculated as a percentage of the net assets attributable to the Units sold by the distributor. The commission payable is calculated on the daily balances and paid out periodically to the distributor as per the agreement entered into with AMC. As the trail commission is calculated on net assets, distributors benefit from increase in net assets arising out of valuation gains in the market. The formula for calculating the trail commission for a day is : Value of Net Assets as on the date of calculating trail commission x Trail commission Rate  / 365 Trail commission for each day is added to get the total trail commission for a period. Value of net assets for the day will be the Number of Units held x the NAV of the day."}, {"n": 33, "q": "The information which is provided in a mutual fund advertisement has to be _______ .", "opts": ["Published in one English and one regional language newspaper", "Approved by Securities and Exchange Board of India", "Timely", "Valid for at least 6 months investment horizon"], "ans": "Timely", "exp": "As per the SEBI Advertisement Code for Mutual Funds - Advertisements shall contain information that is timely and consistent with the disclosures made in the Scheme Information Document, Statement of Additional Information and the Key Information Memorandum. (No approval is required from SEBI except - Prior approval of SEBI shall be required for issuance of any endorsement of Mutual Funds as a financial product, which features a celebrity for the purpose of increasing awareness of Mutual Funds)"}, {"n": 34, "q": "Which of these expenses can be charged to a mutual fund scheme by the AMC ?", "opts": ["Office salaries of fund management team", "Rent of the AMC registered office", "AMC general administration expenses", "Custodian and Fund Administrator fees"], "ans": "Custodian and Fund Administrator fees", "exp": "In addition to the investment and advisory fee, the AMC may charge the mutual fund scheme with recurring expenses including: - marketing and selling expenses including agents’ commission, if any - brokerage and transaction cost - registrar services for transfer of units sold or redeemed - fees and expenses of trustees - audit fees - custodian fees etc."}, {"n": 35, "q": "Which is the Source Scheme in a Systematic Transfer Plan ?", "opts": ["It is the scheme with the lower NAV", "It is the scheme from which funds are transferred", "It is the scheme to which funds are transferred", "It is the scheme with the higher NAV"], "ans": "It is the scheme from which funds are transferred", "exp": "In a Systematic Transfer Plan (STP), the amount that is withdrawn from a scheme (called the source scheme) is re-invested in some other scheme (called the target scheme) of the same mutual fund. For eg. An investor has invested Rs 50,000 in SBI Debt Fund and has a STP to transfer Rs 5000 every month into SBI Mid Cap Fund. Here SBI Debt Fund is the Source fund and SBI Mid Cap Fund is the Target fund."}, {"n": 36, "q": "Identify the FALSE statement/s with respect to a New Fund Offer (NFO). 1. A Closed-ended mutual fund NFO will have a NFO opening date, a NFO closing date and a scheme Re-opening date 2. A Open-ended mutual fund NFO will have a NFO opening date, a NFO closing date and a scheme Re-opening date", "opts": ["Only 1 is false", "Only 2 is false", "Both 1 and 2 are false"], "ans": "Only 1 is false", "exp": "Closed-ended mutual funds typically do not have a scheme re-opening date, as they are not open for continuous subscription and redemption. Once the NFO period is over, investors can buy or sell units on the stock exchange, but the fund is not open for fresh subscriptions . On the other hand, open-ended mutual funds usually re-open for subscription after the NFO period, allowing investors to buy or sell units at the prevailing Net Asset Value (NAV) Therefore, only statement 1 is false."}, {"n": 37, "q": "Which of these information is not contained in the Scheme Information Document (SID)?", "opts": ["Names of securities in the scheme's portfolio", "Investment objective of the scheme", "Risk factors of the scheme", "Portfolio features"], "ans": "Names of securities in the scheme's portfolio", "exp": "The names of securities in the scheme's portfolio is contained in the Fund fact sheet and not in the SID."}, {"n": 38, "q": "Opening of time stamping machine needs to be documented and reported to the Asset Management Company (AMC) - State whether True or False?", "opts": ["True", "False"], "ans": "False", "exp": "The points of acceptance for mutual fund transactions have time stamping machines with tamper-proof seal. Opening the machine for repairs or maintenance is permitted only by vendors or nominated persons of the mutual fund. Such opening of the machine has to be properly documented and reported to the Trustees."}, {"n": 39, "q": "Identify the INCORRECT statement with respect to SEBI Complaints Redress System (SCORES).", "opts": ["SCORES enables the market intermediaries and listed companies to receive complaints from investors, redress such complaints and report redressal", "SCORES is a web-based centralized grievance redress system", "SCORES is completely online, so an investor cannot lodge a physical compliant", "If an investor lodges a physical complaint then such complaints are scanned and then uploaded in SCORES for processing"], "ans": "SCORES is completely online, so an investor cannot lodge a physical compliant", "exp": "While SCORES is primarily online, investors can still submit physical complaints to the SEBI office or concerned intermediary. These physical complaints are then scanned and uploaded onto SCORES for further processing. Therefore - 'SCORES is completely online, so an investor cannot lodge a physical compliant'  - is incorrect."}, {"n": 40, "q": "Identify the FALSE statement/s with respect to benchmarks for mutual fund schemes. A. A Multi-Cap fund can have Nifty 500 index as its benchmark B. A Multi-Cap fund can have BSE Sensex as its benchmark", "opts": ["Only A is false", "Only B is false", "Both A and B are false", "None of the above"], "ans": "Only B is false", "exp": "A Multi-Cap fund invests in Large Cap, Mid Cap and Small Cap stocks as per proportions stipuated by SEBI. The Nifty500 index represents top 100 large cap companies, top 150 Mid-cap companies and top 250 small cap companies. Therefore, it can be a good benchmark for a Multi-Cap fund. The BSE Sensex has 30 large cap stocks from various sectors and it can be good benchmark for a large cap fund and not for a multi cap fund."}, {"n": 41, "q": "Identify the TRUE statement/s with respect to the risks associated with short selling and stock lending. 1. There is counterparty risk and liquidity risk in short selling 2. There is no risk associated with stock lending as the transaction is done through an approved intermediary", "opts": ["Only 1 is true", "Only 2 is true", "Both 1 and 2 are true"], "ans": "Only 1 is true", "exp": "Short-selling is the sale of shares or securities that the seller does not own at the time of trading. Instead, he borrows it from someone who already owns it. Later, the short seller buys back the stock/security he shorted and returns the stock/security to the lender to close out the loan. The inherent risks are Counterparty risk and liquidity risk of the stock/security being borrowed. The security being short sold might be illiquid or become illiquid and covering of the security might occur at a much higher price level than anticipated, leading to losses. Securities Lending is lending of securities through an approved intermediary to a borrower under an agreement for a specified period with the condition that the borrower will return equivalent securities of the same type or class at the end of the specified period along with the corporate benefits accruing on the securities borrowed. There are risks inherent in securities lending, including the risk of failure of the other party. Such failure can result in a possible loss of rights to the collateral, the inability of the approved intermediary to return the securities deposited by the lender and the possible loss of corporate benefits accruing thereon."}, {"n": 42, "q": "Mr. Suresh invests Rs 30000 in an equity fund. The face value of this scheme is Rs 10 and the NAV is Rs 12. The exit load is 2%. How many units will be allotted to Mr. Suresh ?", "opts": ["3000", "2142.8571", "2500", "2411.1574"], "ans": "2500", "exp": "Exit load is not applicable on purchase of units. Its applicable only on sale of units. The units will be allotted to Mr. Suresh as per the NAV which is Rs. 12. Amount invested is Rs 30,000 Units allotted = Amount Invested / NAV = 30000 / 12 = 2500"}, {"n": 43, "q": "Amongst the distribution channel mentioned below, which one is likely to sell funds of only a single mutual fund house?", "opts": ["Distribution Company", "Independent financial advisor", "Institutional sales team of the Asset Management Company", "Bank"], "ans": "Institutional sales team of the Asset Management Company", "exp": "An independent financial advisor, a bank or a distribution company will sell mutual fund schemes of various mutual fund houses as per their clients  requirements and other considerations. However, an institutional sales team of an Asset Management Company will sell schemes only of the single mutual fund house which has appointed it."}, {"n": 44, "q": "These debt mutual funds have been arranged from lowest risk to highest risk. Identify the risk which we are discussing : 1. Liquid Funds 2. Money market funds 3. Medium term bond funds", "opts": ["Interest Rate Risk", "Concentration Risk", "Default Risk", "Credit Risk"], "ans": "Interest Rate Risk", "exp": "Interest rate risk is the risk that an investment's value will change as a result of a change in interest rates. The interest rate risk varies for bonds with different maturities. Those with longer maturity would witness higher price fluctuations in comparison to those with shorter maturities. Similarly short term debt funds will have lower interest rate risk when compared to longer term debt funds. In the above question, Liquid funds have the shortest duration and so will have less adverse effect of interest rate risk when compared to Money market funds and Medium term bond funds."}, {"n": 45, "q": "Which of these funds will generally have a higher fund management cost?", "opts": ["Debt Fund", "Active Equity Fund", "Passive Equity Fund", "Equity Index Fund"], "ans": "Active Equity Fund", "exp": "In Active Equity Funds the fund manager does a lot of buying / selling which result in higher transaction costs. Also a lot of research work goes into it. So the cost of fund management are higher. Equity Index Funds or Passive Equity funds invest in a portfolio that mimics a market index. There is no selection risk in index funds because the fund manager has no role in creating the portfolio. For this reason, the costs that an index fund is allowed to charge is also lower since there are no research or other fund management expenses."}, {"n": 46, "q": "SEBI Complaint Redress System (SCORES) helps an investor to ______ . 1. Lodge a complaint for a grievance 2. Make a follow-up on the complaint 3. Track the status of redressal of such complaints online", "opts": ["Only 1", "Only 1 and 3", "Only 1 and 2", "All 1, 2 and 3"], "ans": "All 1, 2 and 3", "exp": "SEBI Complaint Redress System (SCORES) is a web-based centralized grievance redress system of SEBI. SCORES enables investors to lodge, follow up on their complaints and track the status of redressal of such complaints online on the website - http://scores.gov.in"}, {"n": 47, "q": "Among equity funds, Focused funds carry _______ risks as compared to diversified funds due to ______ .", "opts": ["Lower ; highly concentrated portfolio", "Higher ; highly concentrated portfolio", "Lower ; lower expenses of the fund", "Higher ; investments in debt securities"], "ans": "Higher ; highly concentrated portfolio", "exp": "Among the equity funds, some schemes may have a portfolio concentrated in a few stocks. Such scheme category is known as “Focused funds”. . These schemes carry higher risk than a diversified fund, due to higher concentration among smaller number of stocks."}, {"n": 48, "q": "Which debt schemes of mutual funds invest only in debt securities where moneys will be repaid within 91 days?", "opts": ["Money Market Funds", "Medium term debt funds", "Fixed Maturity Plans", "Liquid Funds"], "ans": "Liquid Funds", "exp": "Liquid Funds invest in debt and money market instruments with a maturity of up to 91 days. These are considered relatively low-risk and highly liquid among debt mutual funds."}, {"n": 49, "q": "Identify the false statement/s : A. While evaluating the mutual fund schemes, the expense ratio matters more in debt funds than equity funds B. An Ultra-short term debt fund has to mandatorily invest in high credit quality debt securities", "opts": ["Only A is false", "Only B is false", "Both A and B are false"], "ans": "Only B is false", "exp": "Any cost is a drag on investor’s returns. Investors need to be particularly careful about the cost structure of debt schemes, because in the normal course, debt returns can be much lower than equity schemes. So expense ratio is more critical for debt funds. When the limits are not tightly defined, the fund manager may assume an active role in managing the risk, e.g. an ultra-short term debt fund may take credit risk, since the SEBI regulations only define the permitted maturity profile, which indicates how much interest rate risk the scheme can take."}, {"n": 50, "q": "Identify the TRUE statement - A. It is mandatory for the AMC to disclose the valuation policy B. The AMC is not accountable for policies and procedures for detecting and preventing incorrect valuation", "opts": ["Only A is true", "Only B is true", "Both A and B are true"], "ans": "Only A is true", "exp": "Disclosure of the valuation policy and procedures approved by the Board of the AMC shall be made in Statement of Additional Information, on the website of the AMC to ensure transparency of valuation norms to be adopted by asset management company. The responsibility of true and fairness of valuation and correct NAV shall be of the Asset Management Company, irrespective of disclosure of the approved valuation policies and procedures."}, {"n": 51, "q": "Performance of a portfolio is influenced by _______ .", "opts": ["Stock Selection", "Investment Policy", "Asset Allocation Strategy", "All of the above"], "ans": "All of the above", "exp": "A portfolio consists of various types of investment products. It is influenced by the investment policy includes the scheme’s asset allocation and investment style. Also equity returns are a function of sector and stock selection which will influence the portfolio performance."}, {"n": 52, "q": "The additional Total Expense Ratio (TER) charged has to be credited back to the Mutual Fund in which of these situations?", "opts": ["When the performance of the mutual fund declines as compared to previous year", "When the inflows from beyond the top 30 cities are redeemed within a period of 1 year from the date of investment.", "When the TER of the mutual fund exceeds the limit specified under the regulations", "All of the above"], "ans": "When the inflows from beyond the top 30 cities are redeemed within a period of 1 year from the date of investment.", "exp": "Mutual funds can charge additional TER if the new inflows are from beyond top 30 cities (subject to some conditions) However, the additional TER on account of inflows from beyond the top 30 cities so charged shall be credited back to the scheme in case the said inflows are redeemed within a period of 1 year from the date of investment."}, {"n": 53, "q": "All transactions of purchase and sale of securities by key personnel of the AMC, who are directly involved in investment operations shall be disclosed to the compliance officer of the member at least on _______ .", "opts": ["Weekly basis", "Monthly basis", "Half-Yearly basis", "Yearly basis"], "ans": "Half-Yearly basis", "exp": "As per the AMFI Code of Ethics - All transactions of purchase and sale of securities by key personnel who are directly involved in investment operations shall be disclosed to the compliance officer of the member at least on half yearly basis and subsequently reported to the Board of Trustees if found having conflict of interest with the transactions of the fund."}, {"n": 54, "q": "Identify the correct statement(s) related to the Statement of Additional Information (SAI). A) The SAI should be updated regularly within three months after the close of every financial year. B) Any material changes must be updated on an ongoing basis and displayed on the websites of both the mutual fund and AMFI.", "opts": ["Only A", "Only B", "Both A and B", "None of the above"], "ans": "Both A and B", "exp": "The Statement of Additional Information (SAI) contains extra details about the mutual fund, such as operational and legal information. SEBI rules require that the SAI be updated regularly within 3 months after the end of each financial year. Any material changes must also be updated immediately and uploaded on the websites of the Mutual Fund and Association of Mutual Funds in India (AMFI)."}, {"n": 55, "q": "Identify the FALSE statement/s : 1. For equity mutual funds schemes which are actively managed (eg. Diversified equity fund/Balance funds), the net asset value need NOT be declared up to 4 decimal points 2. Each mutual fund scheme’s account is combined with the accounts of the Asset Management Company", "opts": ["Only 1 is false", "Only 2 is false", "Both 1 and 2 are false"], "ans": "Only 2 is false", "exp": "Key Accounting and Reporting Requirements for mutual funds : - The accounts of the schemes need to be maintained distinct from the accounts of the AMC. The auditor for the AMC has to be different from that of the schemes. - NAV for equity and balanced funds is to be calculated up to at least 2 decimal places. (and not 4).  NAV is to be calculated up to 4 decimal places in the case of index funds, liquid funds and other debt funds."}, {"n": 56, "q": "A top performing scheme within a category _______ .", "opts": ["Is the best choice for an investor to invest his funds", "may or may not be the top performer in the next years to come", "usually remains the top performer for a long period of time", "usually be the worst performer in the next years to come"], "ans": "may or may not be the top performer in the next years to come", "exp": "As experience has shown time and again, the top performers during one period may not necessarily remain as a top performer forever or near the other top performers. In such a case, simply buying into a scheme due to good returns in the recent past may not be a wise approach. The mutual fund advertisements use the disclaimer: “Past performance may or may not be sustained in future”."}, {"n": 57, "q": "Identify the TRUE statement with respect to ‘Jensen’s Alpha’ of a mutual fund scheme?", "opts": ["It is a measure of outperformance after adjusting for the risk taken", "It is a measure of risk and outperformance is related to returns", "It is a measure of simple outperformance, irrespective of the risk taken", "None of the above"], "ans": "It is a measure of outperformance after adjusting for the risk taken", "exp": "Jensen's Alpha is used to determine the abnormal return of a security or portfolio of securities over the theoretical expected return. It is a risk-adjusted performance measure that represents the average return on a portfolio or investment, above or below that predicted by the capital asset pricing model (CAPM), given the portfolio's or investment's beta and the average market return."}, {"n": 58, "q": "The appropriate benchmark for a short term debt scheme will be _______ .", "opts": ["1 Year T-Bill index", "Nifty50", "10 year dated GoI security", "5 year dated GoI security"], "ans": "1 Year T-Bill index", "exp": "Appropriate Benchmarks : Equity scheme  -  Sensex or Nifty Long term debt scheme - 10 year dated GoI security Short-term debt fund -  1 year T-Bill"}, {"n": 59, "q": "As per SEBI guidelines, _________ is/are vested with the responsibility of developing indices as benchmark for debt mutual fund schemes.", "opts": ["AMFI", "The mutual fund themselves", "The risk management department of the AMC's", "Research and rating agencies"], "ans": "Research and rating agencies", "exp": "As per the SEBI guidelines, the benchmark for debt (and balanced schemes) should be developed by research and rating agencies recommended by AMFI. CRISIL, ICICI Securities and NSE have developed various such indices."}, {"n": 60, "q": "SEBI has to approve the Scheme Related Documents in ______ .", "opts": ["7 days", "15 days", "1 month", "SEBI does not approve the Scheme Related Documents. It only gives its observations"], "ans": "SEBI does not approve the Scheme Related Documents. It only gives its observations", "exp": "SEBI does not approve or disapprove the Scheme Related Documents, it gives its observations. The mutual fund needs to incorporate these observations in these documents. Thus, the documents in the market are “vetted” by SEBI, and not approved by SEBI."}, {"n": 61, "q": "______ is an example of physical asset.", "opts": ["Bank Deposit", "Shares and Debentures", "Land and Building", "Futures and Options"], "ans": "Land and Building", "exp": "Land and buildings are physical property. Shares, Debentures, Bank Deposits, F&O are all financial assets/instruments."}, {"n": 62, "q": "Mohit needs Rs. 2,00,000 in 5 years from now. The interest rate is 7%. The amount required today to be invested can be calculated by using the formula ______ .", "opts": ["200000 / (1+0.07)^5", "200000 * (1- 0.07)^5", "200000 / (1+0.07)*5", "200000 * (1+0.07)*5"], "ans": "200000 / (1+0.07)^5", "exp": "The formula for calculating the Future Value of an investment made today is  FV = PV * (1 + r) ^ n Where FV is the future value ; PV is the present value ; r is the rate of inflation or interest rate ; n is the number of years Thus the formula for Present value will be  PV =  FV / (1 + r) ^ n Subsituting the above numbers : PV = 2,00,000 / (1+0.07)^ 5"}, {"n": 63, "q": "SEBI has regulations pertaining to restrictions on the investment policies of mutual fund schemes for ensuring that _____ .", "opts": ["The mutual scheme can improve their ratings over a period of time", "The scheme returns are better than the benchmark returns", "The scheme returns are better than the Nifty/Sensex", "The mutual fund scheme has a minimum diversification as per the requirements"], "ans": "The mutual fund scheme has a minimum diversification as per the requirements", "exp": "The investors have no control, over the investment management of the mutual fund. It is in this context that SEBI has laid down regulations pertaining to investment universe, restrictions and portfolio diversification for investment by mutual fund schemes. Such regulations intend to control the risks taken by the mutual fund managers."}, {"n": 64, "q": "Which exam has to be cleared to get the Employee Unique Identification Number (EUIN) from AMFI?", "opts": ["SEBI - VA Mutual Fund Distributors Certification Examination", "AMFI - VA Mutual Fund Distributors Certification Examination", "NISM - VA Mutual Fund Distributors Certification Examination", "NISM - VB Mutual Fund Distributors Certification Foundation"], "ans": "NISM - VA Mutual Fund Distributors Certification Examination", "exp": "Institutions that are into the distribution of mutual funds need to register with AMFI. The employees of these institutions need to clear the NISM Series V-A: Mutual Fund Distributors Certification Examination and obtain an Employee Unique Identification Number (EUIN) from AMFI."}, {"n": 65, "q": "In the usual course of events, a fund manager will have to provide the maximum liquid assets for _______ .", "opts": ["Gold ETFs", "Equity ETFs", "Close-end fund", "Open-end fund"], "ans": "Open-end fund", "exp": "ETFs and Close-end funds are listed on the stock exchanges and investors can sell their units their. They need not give redemption request to the AMCs. So, the fund manager need not maintain liquid funds for Close-end funds and ETFs. In an open-end fund, investors can buy or redeem units directly from the fund at any time. Therefore, the fund manager needs to maintain higher liquid assets/cash to meet frequent redemption requests. Hence, maximum liquidity is normally required for an Open-end fund."}, {"n": 66, "q": "_______ can be used in lieu of Income distribution cum capital withdrawal pay-outs.", "opts": ["Systematic Investment Plan", "Systematic Transfer Plan", "Systematic Withdrawal Plan", "All of the above"], "ans": "Systematic Withdrawal Plan", "exp": "The Income distribution cum capital withdrawal (dividend) pay-out option is for investors wanting a regular income. Systematic Withdrawal Plan(SWP) is a facility which allows an investor to withdraw a fixed amount at pre-determined intervals. Therefore an Income distribution cum capital withdrawal (dividend) pay-out option is similar to SWP. The difference is that the dividend is paid only when the fund has a surplus amount and in SWP the amount is compulsarily paid. (The dividend pay-out plan is renamed as pay-out of income distribution cum capital withdrawal, dividend re-investment plan is renamed as reinvestment of income distribution cum capital withdrawal option followed by renaming of dividend transfer plan to transfer of income distribution cum capital withdrawal plan)"}, {"n": 67, "q": "Which of these expenses can be charged to a mutual fund scheme by the AMC?", "opts": ["Rent for registered office of the mutual fund", "Salaries of fund management team", "General administration expenses of the AMC", "Fees of custodians and fund administrators"], "ans": "Fees of custodians and fund administrators", "exp": "As per SEBI regulations, Asset Management Companies (AMCs) can charge certain expenses to a mutual fund scheme, but they must be directly related to the management and operation of the fund. Custodian and fund administrator fees are essential expenses for managing the fund’s assets and ensuring compliance with regulatory requirements. Rent for the registered office, salaries of the fund management team, and general administration expenses of the AMC are not directly attributable to a specific mutual fund scheme and must be borne by the AMC itself."}, {"n": 68, "q": "As per the Advertisement Guidelines for Mutual Funds, Point-to-point returns on a standard investment of Rs. 10,000 shall also be shown in addition to CAGR for a scheme which has been for existence _______ .", "opts": ["More than 5 years", "More than 3 years", "More than 2 years", "Irrespective of years of existence, all mutual fund schemes must show the point to point returns"], "ans": "More than 3 years", "exp": "As per the SEBI Advertisement Guidelines for Mutual Funds, when the mutual fund scheme has been in existence for more than THREE years : - Performance advertisement of mutual fund schemes shall be provided in terms of CAGR for the past 1 year, 3 years, 5 years and since inception. - Point-to-point returns on a standard investment of Rs. 10,000 shall also be shown in addition to CAGR for the scheme to provide ease of understanding to retail investors."}, {"n": 69, "q": "Which of the following is INCORRECT with respect to advertisements of Mutual Funds by AMCs.", "opts": ["The advertisements can use celebrities for endorsements", "The advertisements can show past performance of the scheme", "The advertisements can show the return numbers", "All of the above are incorrect"], "ans": "The advertisements can use celebrities for endorsements", "exp": "As per SEBI guidelines, mutual fund advertisements cannot use celebrities for endorsements. The aim is to ensure that investment decisions are based on the merits of the scheme and not influenced by the popularity of a celebrity. (Note - AMFI can use celebrities to promote mutual funds investment like it does with the tag line 'Mutual Funds Sahi Hai' but individual mutual funds cannot use celebrities)"}, {"n": 70, "q": "Ms. Priya redeems 2000 units at an NAV of Rs 13. If the exit load is 1 percent, what is the redemption value of the investment?", "opts": ["Rs. 25500", "Rs. 26000", "Rs. 25740", "Rs. 26250"], "ans": "Rs. 25740", "exp": "Ms. Priya redeems 2000 units at an NAV of Rs 13 = 2000 x 13 = 26000 Exit load at 1% of 26000 = 260 Redemption value = 26000 - 260 = Rs. 25740 Q 1. Which of the following correctly explains the difference between the Sharpe Ratio and the Treynor Ratio?Sharpe Ratio is meant for schemes that outperform benchmarks, while Treynor Ratio applies to underperforming fundsThe Sharpe Ratio measures risk using Standard Deviation, while the Treynor Ratio uses Beta as the risk metricBoth ratios are exactly the same and serve the same purposeNone of the above WRONG ANSWERCORRECT ANSWER: The Sharpe Ratio measures risk using Standard Deviation, while the Treynor Ratio uses Beta as the risk metric Explanation: Both Sharpe Ratio and Treynor Ratio measure a fund's risk-adjusted return — i.e., how much excess return the fund generates over the risk-free rate per unit of risk. However, the key difference lies in how they define and measure \"risk.\" Sharpe Ratio uses Standard Deviation as the risk measure — which captures the fund's total risk (both systematic + unsystematic risk). It is ideal for evaluating a standalone/concentrated portfolio. Treynor Ratio uses Beta as the risk measure — which captures only systematic risk (market risk). It is more suitable for evaluating a well-diversified portfolio where unsystematic risk has already been eliminated. Q 2. Identify the mandatory scheme-related documents from the options given below:A) Key Information Memorandum (KIM)B) Fund factsheetC) AddendumD) Scheme Information Document (SID)E) Statement of Additional Information (SAI)A, B, C, D and EB, C, D and EA, B and EA, C, D and E WRONG ANSWERCORRECT ANSWER: A, C, D and E Explanation: Mandatory Scheme-Related Documents (as per SEBI/AMFI guidelines) : - Statement of Additional Information (SAI) – contains statutory information about the mutual fund, AMC, trustees, etc. - Scheme Information Document (SID) – detailed document about the specific scheme, including objectives, risks, fees, and portfolio strategy. - Key Information Memorandum (KIM) – a summarized version of SID, highlighting key facts for investors. - Addendum – issued whenever there is a change in SID/SAI/KIM; it is considered part of the mandatory documentation. Not Mandatory : - Fund Fact Sheet – this is an investor communication tool published monthly/quarterly, but it is not a statutory mandatory document under SEBI regulations. Q 3. Which of the following tools is commonly used to assess an investor’s risk appetite?Risk aggregatorsRisk profilersAsset allocatorsPortfolio optimizers WRONG ANSWERCORRECT ANSWER: Risk profilers Explanation: Risk appetite means the level of risk an investor is willing to take. It is assessed using risk profilers, which ask questions about income, goals, investment horizon, and comfort with market fluctuations. Based on the answers, the investor is categorized as conservative, moderate, or aggressive. This helps in selecting suitable mutual fund schemes. Q 4. A sum of Rs.5,00,000 was invested by an investor in a 370-day FMP scheme, and the maturity value received was Rs. 5,36,400 . Calculate the capital gain in rupees.Rs. 36400Rs. 34750Rs. 32500Complete data not available CORRECT ANSWER Explanation: Capital gain means the profit earned on the investment. Capital Gain = Maturity Amount − Investment Amount 5,36,400  – 5,00,000 = 36,400 So, the investor earned a profit of Rs. 36,400 on the FMP investment. The number of days (370 days) does not change the capital gain amount in this question. Q 5. Identify the true statement from the options below:A) Expense ratios play a more important role in evaluating debt mutual fund schemes compared to equity schemesB) A fund that has performed well over the long term will necessarily continue to provide higher returns in the futureC) An ultra short-term debt fund will always invest only in high credit quality instrumentsStatement A onlyStatement B onlyStatement C onlyAll are true CORRECT ANSWER Explanation: Expense ratio is very important in debt mutual funds because debt funds generally generate moderate returns. A higher expense ratio can significantly reduce the investor’s final return. Statement B is false because past performance does not guarantee future returns. Statement C is also false as there is no mandatory rule that ultra short duration funds must invest only in high credit quality instruments. The fund manager has discretion on credit quality. Q 6. Which of the following strategies helps in ensuring the suitability of a mutual fund scheme to an investor’s needs and circumstances?Asset allocationTax harvestingDividend strippingIndexation CORRECT ANSWER Explanation: Asset Allocation is the strategy of spreading investments across different asset classes — such as equity, debt, gold, and cash — based on the investor's age, risk appetite, financial goals, and investment horizon. It ensures that the right mix of schemes is chosen that truly suits the investor's personal situation. It helps ensure that the mutual fund investment suits the investor’s financial situation and risk appetite. A proper asset allocation strategy balances risk and return. Q 7. Which of the following correctly describes a mutual fund unit holder?A shareholder in the Asset Management Company (AMC)A depositor in the mutual fundA shareholder of the trustee companyA beneficial owner of the assets held by the fund WRONG ANSWERCORRECT ANSWER: A beneficial owner of the assets held by the fund Explanation: When an investor puts money into a mutual fund, they receive units in return. These units represent their proportionate ownership in the pool of assets held by the fund. The investor is therefore called a \"Beneficial Owner\" — meaning they enjoy the economic benefits (returns, dividends, appreciation) of the underlying assets without directly holding those assets in their name. Q 8. State whether the following statement is correct:'In the Income Distribution cum Capital Withdrawal (IDCW) reinvestment option, investments appreciate more quickly than in the growth option because investors receive extra units.'Determined by whether the scheme is open-ended or closed-endedFalse for all fund categoriesCorrect for all fund categoriesCorrect only for equity-oriented schemes WRONG ANSWERCORRECT ANSWER: False for all fund categories Explanation: This is a very common misconception among investors. Many people think that the IDCW Reinvestment option grows faster because you get \"extra units.\" However, this is NOT true : When an IDCW (dividend) is declared, the NAV of the fund drops by exactly the dividend amount before reinvestment. The additional units you receive are bought at this lower NAV. So the total value of your investment remains the same — you just have more units at a lower NAV. In other words : In the IDCW reinvestment option, the distributed amount is used to buy additional units, but the NAV falls to the extent of the IDCW paid. Therefore, IDCW reinvestment does not grow faster simply because additional units are allotted. Q 9. Identify the statement that is NOT TRUE about the Key Information Memorandum (KIM).KIM contains merely the names of the sponsor, trust, and AMC without explaining their rolesKIM needs to be issued only if an investor requests for itKIM serves as an abridged form of scheme information documentsKIM is attached with every mutual fund application form WRONG ANSWERCORRECT ANSWER: KIM needs to be issued only if an investor requests for it Explanation: The Key Information Memorandum (KIM) is a short summary of the Scheme Information Document (SID). It is mandatory to attach the KIM with every mutual fund application form so investors can understand the scheme before investing. It includes details about the AMC, sponsor, trustee, and their functions. Therefore, it is not given only on request — it must be provided to all investors. Q 10. When an investor applies for mutual fund units in dematerialised form, where will the allotted units be credited?A newly opened Demat account with a depository tied up with the mutual fundThe investor’s Demat account mentioned in the application formA newly created Demat account linked to the mutual fund’s Demat accountAny of the above options WRONG ANSWERCORRECT ANSWER: The investor’s Demat account mentioned in the application form Explanation: When an investor applies for mutual fund units in dematerialised form, the units are credited directly to the investor’s own Demat account. The Demat account details must be provided in the application form. No new Demat account is opened by the mutual fund or depository for this purpose. Hence, the units are credited to the existing Demat account mentioned by the investor. Q 11. An international fund of fund is required to invest at least what percentage of its total assets in the underlying fund ?95%50%80%65% CORRECT ANSWER Explanation: An International Fund of Fund (FoF) mainly invests in units of an overseas mutual fund or scheme. As per SEBI regulations, such funds must invest at least 95% of their total assets in the underlying overseas fund. This ensures the scheme truly reflects international exposure. Q 12. A mutual fund scheme pools funds primarily from investors who have :Similar investment objectivesSimilar surplus funds for investmentInvestors belonging to the same geographical regionSimilar levels of investment capital CORRECT ANSWER Explanation: A mutual fund scheme pools money from a large number of investors who share a common investment objective For example, some investors may want long-term capital growth, some may want regular income, and some may want capital safety. Each type of investor chooses a fund that matches their goal (objective). Q 13. Identify the true statement related to benchmarking of Gold Exchange Traded Funds (ETFs).CRISIL Gilt Fund Index serves as a benchmark for Gold ETFsGold prices are generally used as the benchmark for Gold ETFsBenchmarking is not possible for Gold ETFsGold ETFs do not require any benchmark WRONG ANSWERCORRECT ANSWER: Gold prices are generally used as the benchmark for Gold ETFs Explanation: Gold ETFs invest primarily in physical gold, so their performance is expected to closely reflect the movement in gold prices. Therefore, the most appropriate benchmark for a Gold ETF is the price of gold itself. Q 14. An asset management company cannot recover which of the following expenses from a mutual fund scheme?Expenditure on mandatory statutory advertisementsCosts incurred for investor communicationsInterest paid due to delayed redemption payoutsExpenses related to marketing and sales activities WRONG ANSWERCORRECT ANSWER: Interest paid due to delayed redemption payouts Explanation: An Asset Management Company (AMC) can charge certain operating expenses to a mutual fund scheme such as marketing expenses, statutory advertisement costs and investor communication expenses, because these are part of running and managing the scheme. However, if the AMC delays redemption payments beyond the allowed timeline, the interest penalty for that delay must be borne by the AMC itself and not by the mutual fund scheme or investors. This rule protects investors from suffering due to operational inefficiency or mistakes made by the AMC. Q 15. What is the risk known as which arises out of the mis-pricing or improper valuation of derivative contracts?Credit RiskBasis RiskModel RiskDuration Risk WRONG ANSWERCORRECT ANSWER: Model Risk Explanation: Model risk arises when the pricing or valuation model used for derivatives is incorrect or inappropriate. If the derivative contract is wrongly valued, it can lead to losses for investors or the fund. This risk is especially important in complex financial instruments. Therefore, mis-pricing or improper valuation of derivatives is called model risk. Q 16. An Indian international fund is investing in US stocks. What would be the impact on it if US Dollar appreciates against the Indian Rupee?No impact on the fund as its investing in stocks and not currencyThe NAV of the scheme in Indian Rupees will appreciateThe NAV of the scheme in Indian Rupees will depreciate WRONG ANSWERCORRECT ANSWER: The NAV of the scheme in Indian Rupees will appreciate Explanation: An Indian international mutual fund investing in US stocks is exposed to two things: Performance of the US stocks and Currency movement (USD/INR). So when the US Dollar appreciates against the Indian Rupee: 1. The value of the US assets, when converted into INR, becomes higher 2. Therefore, the NAV of the fund in INR increases, even if the underlying US stocks remain flat. Example : Suppose the fund owns 1,000 US Dollars worth of US stocks. If USD/INR = Rs. 80 then value in INR = Rs. 80,000 If USD/INR rises to Rs. 85 then value in INR = Rs. 85,000 Even if the US stock values remain the same, the NAV rises due to currency appreciation. Q 17. Identify the information which is NOT included in the Statement of Additional Information (SAI) ?Tax, Legal & General InformationCurrent SIP returns of the mutual fund schemesInvestment Valuation NormsRights of Unit-holders WRONG ANSWERCORRECT ANSWER: Current SIP returns of the mutual fund schemes Explanation: Statement of Additional Information (SAI), which has statutory information about the mutual fund or AMC, that is offering the scheme like the Constituents of the mutual fund, Rights of Unit-holders, Investment Valuation Norms, Rights of Unit-holders etc. Latest SIP returns are dynamic performance data that change regularly and are scheme-specific — so they are disclosed through Factsheets or the AMFI website, not in the SAI. Q 18. Non resident Indian (NRI) applications should be accompanied by cheque drawn on _______ for repatriable investments.NRE Account onlyNRO Account onlyNRE and NRO Account onlyLocal Account CORRECT ANSWER Explanation: Non resident Indian (NRI) / Person of Indian Origin (PIO)  residents abroad have the facility of investing on a repatriable basis i.e., when they sell their investments, the sale proceeds can be transferred abroad. Alternatively, they can invest on a non-repatriable basis, in which case the proceeds from the sale of those investments cannot be remitted abroad. NRI/PIO applications need to be accompanied by a cheque drawn on an NRO/NRE account (for non-repatriable investment) or NRE account (for repatriable investment). Q 19. Identify the CORRECT statement/s.A mutual fund unit holder can approach the court of law for a matter which was fairly and transparently stated in the Scheme Documents, but he wasn't aware of itA mutual fund unit holder can approach the court of law for a provision of law, which was fairly and transparently stated in the Scheme Documents, but he wasn't aware of itBoth of the aboveNone of the above WRONG ANSWERCORRECT ANSWER: None of the above Explanation: The principle of caveat emptor (LET THE BUYER BEWARE) applies to mutual fund investments. So, the unit-holder cannot seek legal protection on the grounds of not being aware, especially when it comes to the provisions of law and matters fairly and transparently stated in the Scheme Documents. Q 20. As per the fair valuation principles laid out by SEBI, it is mandatory to disclose thevaluation policy in ______.Statement of Additional InformationStatement of Accounts sent to investors periodicallyFund fact sheetThe fair valuation principles are not to be put in public CORRECT ANSWER Explanation: Disclosure of the valuation policy and procedures approved by the Board of the asset management company shall be made in Statement of Additional Information. Q 21. A mutual fund scheme mentions that it will invest not more than 10% of its assets in the money market. This is considered to be the scheme's ________ .Investment PolicyInvestment ObjectiveStock Market PolicyRisk Profile CORRECT ANSWER Explanation: The Investment Policy of  mutual fund scheme includes the scheme’s asset allocation and investment style. A mutual fund scheme with the objective of providing liquidity would invest in money market instruments or in debt papers of very short-term maturity. At the same time, a mutual fund scheme that aims to generate capital appreciation over long periods would invest in equity shares. This would reflect in the scheme’s asset allocation, which would be disclosed in the Scheme Information Document (SID). Q 22. In a Large Cap mutual fund scheme, the minimum investment limit in equity and equity related instruments of large cap companies is ______ .90%80%70%60% WRONG ANSWERCORRECT ANSWER: 80% Explanation: A Large Cap Fund is an open-ended equity scheme predominantly investing in large cap stocks. As per SEBI rules on asset allocation, the minimum investment in equity and equity related instruments of large cap companies shall be 80 percent of total assets. Q 23. Which entity processes the purchase and redemption transactions of investors of an open-ended fund ?The CustodianThe Broker / Mutual Fund AgentAMFIThe R & T Agent WRONG ANSWERCORRECT ANSWER: The R & T Agent Explanation: The Registrar and Transfer Agency (RTA) maintains investor records as well as allots or redeems units, processes purchase/redemption/switch requests, dividends, etc. It also generates the account statement that an investor receives. Q 24. Which of these authorities uses the information collected under FATCA?Foreign GovernmentIndian GovernmentIndian Tax AuthoritiesAll of the above WRONG ANSWERCORRECT ANSWER: All of the above Explanation: To comply with the requirements of Foreign Account Tax Compliance Act (FATCA) and Common Reporting Standards (CRS) provisions, financial institutions, including mutual funds, are required to undertake due diligence process to identify foreign reportable accounts and collect such information as required under the said provisions and report the same to the US Internal Revenue Service/any other foreign government or to the Indian Govt / Tax Authorities for onward transmission to the concerned foreign authorities. Q 25. The investment in equity and equity related instruments is between _________ in a Balanced Hybrid Fund.Between 65 percent and 80 percent of total assetsBetween 50 percent and 75 percent of total assetsBetween 40 percent and 60 percent of total assetsBetween 10 percent and 25 percent of total assets WRONG ANSWERCORRECT ANSWER: Between 40 percent and 60 percent of total assets Explanation: Balanced Hybrid Fund: An open-ended balanced scheme investing in equity and debt instruments. The investment in equity and equity related instruments shall be between 40 percent and 60 percent of total assets while investment. In Conservative Hybrid Fund, its between10 percent and 25 percent of total assets. In Aggressive Hybrid Fund, its between 65 percent and 80 percent of total assets. Q 26. Which of these is NOT included in the Statement of Account issued by a mutual fund?The Unit BalanceThe NAV at the time of issue of the statementAll the transactions done during the period of the statementThe securities in which the money was invested WRONG ANSWERCORRECT ANSWER: The securities in which the money was invested Explanation: Mutual funds issue the Statement of Account and this shows for each transaction (sale/re-purchase) during that period, the value of the transaction, the relevant NAV and the number of units transacted. Besides, it also provides the closing balance of units held in that folio and the value of those units based on the latest NAV. It does not show in which stocks / debt etc. the money is invested. Q 27. What is the regulatory requirement with respect to a change in the controlling interest in an AMC ?The unitholders have to be given the option to exitA minimum of 50% of the unitholders have to approve the change in controlling interestThe trustees have to give the unitholders the option to wind-up the schemeAll of the above CORRECT ANSWER Explanation: A change in the control of the AMC directly or indirectly can be made only with the prior approval of the trustees and SEBI. A written communication about the change in the control of the AMC is sent to each unitholder and an advertisement is given. The unitholders are given the option to exit on the prevailing Net Asset Value (NAV) without any exit load within a time period not less than 30 calendar days from the date of communication. Q 28. No redemption or subscription is allowed in a Segregated Portfolio - State whether True or False?TrueFalse CORRECT ANSWER Explanation: “Segregated portfolio” means a portfolio, comprising of debt or money market instrument affected by a credit event, that has been segregated in a mutual fund scheme. No redemption or subscription is allowed in the segregated portfolio. However, in order to facilitate exit to unitholders in segregated portfolio, AMC shall enable listing of units of segregated portfolio on the recognized stock exchange. Q 29. A Certificate of Deposit is
