distribution cum capital withdrawal, dividend re-investment plan is renamed as reinvestment of income distribution cum capital withdrawal option followed by renaming of dividend transfer plan to transfer of income distribution cum capital withdrawal plan)"}, {"n": 67, "q": "Which of these expenses can be charged to a mutual fund scheme by the AMC?", "opts": ["Rent for registered office of the mutual fund", "Salaries of fund management team", "General administration expenses of the AMC", "Fees of custodians and fund administrators"], "ans": "Fees of custodians and fund administrators", "exp": "As per SEBI regulations, Asset Management Companies (AMCs) can charge certain expenses to a mutual fund scheme, but they must be directly related to the management and operation of the fund. Custodian and fund administrator fees are essential expenses for managing the fund’s assets and ensuring compliance with regulatory requirements. Rent for the registered office, salaries of the fund management team, and general administration expenses of the AMC are not directly attributable to a specific mutual fund scheme and must be borne by the AMC itself."}, {"n": 68, "q": "As per the Advertisement Guidelines for Mutual Funds, Point-to-point returns on a standard investment of Rs. 10,000 shall also be shown in addition to CAGR for a scheme which has been for existence _______ .", "opts": ["More than 5 years", "More than 3 years", "More than 2 years", "Irrespective of years of existence, all mutual fund schemes must show the point to point returns"], "ans": "More than 3 years", "exp": "As per the SEBI Advertisement Guidelines for Mutual Funds, when the mutual fund scheme has been in existence for more than THREE years : - Performance advertisement of mutual fund schemes shall be provided in terms of CAGR for the past 1 year, 3 years, 5 years and since inception. - Point-to-point returns on a standard investment of Rs. 10,000 shall also be shown in addition to CAGR for the scheme to provide ease of understanding to retail investors."}, {"n": 69, "q": "Which of the following is INCORRECT with respect to advertisements of Mutual Funds by AMCs.", "opts": ["The advertisements can use celebrities for endorsements", "The advertisements can show past performance of the scheme", "The advertisements can show the return numbers", "All of the above are incorrect"], "ans": "The advertisements can use celebrities for endorsements", "exp": "As per SEBI guidelines, mutual fund advertisements cannot use celebrities for endorsements. The aim is to ensure that investment decisions are based on the merits of the scheme and not influenced by the popularity of a celebrity. (Note - AMFI can use celebrities to promote mutual funds investment like it does with the tag line 'Mutual Funds Sahi Hai' but individual mutual funds cannot use celebrities)"}, {"n": 70, "q": "Ms. Priya redeems 2000 units at an NAV of Rs 13. If the exit load is 1 percent, what is the redemption value of the investment?", "opts": ["Rs. 25500", "Rs. 26000", "Rs. 25740", "Rs. 26250"], "ans": "Rs. 25740", "exp": "Ms. Priya redeems 2000 units at an NAV of Rs 13 = 2000 x 13 = 26000 Exit load at 1% of 26000 = 260 Redemption value = 26000 - 260 = Rs. 25740 Q 1. Which of the following correctly explains the difference between the Sharpe Ratio and the Treynor Ratio?Sharpe Ratio is meant for schemes that outperform benchmarks, while Treynor Ratio applies to underperforming fundsThe Sharpe Ratio measures risk using Standard Deviation, while the Treynor Ratio uses Beta as the risk metricBoth ratios are exactly the same and serve the same purposeNone of the above WRONG ANSWERCORRECT ANSWER: The Sharpe Ratio measures risk using Standard Deviation, while the Treynor Ratio uses Beta as the risk metric Explanation: Both Sharpe Ratio and Treynor Ratio measure a fund's risk-adjusted return — i.e., how much excess return the fund generates over the risk-free rate per unit of risk. However, the key difference lies in how they define and measure \"risk.\" Sharpe Ratio uses Standard Deviation as the risk measure — which captures the fund's total risk (both systematic + unsystematic risk). It is ideal for evaluating a standalone/concentrated portfolio. Treynor Ratio uses Beta as the risk measure — which captures only systematic risk (market risk). It is more suitable for evaluating a well-diversified portfolio where unsystematic risk has already been eliminated. Q 2. Identify the mandatory scheme-related documents from the options given below:A) Key Information Memorandum (KIM)B) Fund factsheetC) AddendumD) Scheme Information Document (SID)E) Statement of Additional Information (SAI)A, B, C, D and EB, C, D and EA, B and EA, C, D and E WRONG ANSWERCORRECT ANSWER: A, C, D and E Explanation: Mandatory Scheme-Related Documents (as per SEBI/AMFI guidelines) : - Statement of Additional Information (SAI) – contains statutory information about the mutual fund, AMC, trustees, etc. - Scheme Information Document (SID) – detailed document about the specific scheme, including objectives, risks, fees, and portfolio strategy. - Key Information Memorandum (KIM) – a summarized version of SID, highlighting key facts for investors. - Addendum – issued whenever there is a change in SID/SAI/KIM; it is considered part of the mandatory documentation. Not Mandatory : - Fund Fact Sheet – this is an investor communication tool published monthly/quarterly, but it is not a statutory mandatory document under SEBI regulations. Q 3. Which of the following tools is commonly used to assess an investor’s risk appetite?Risk aggregatorsRisk profilersAsset allocatorsPortfolio optimizers WRONG ANSWERCORRECT ANSWER: Risk profilers Explanation: Risk appetite means the level of risk an investor is willing to take. It is assessed using risk profilers, which ask questions about income, goals, investment horizon, and comfort with market fluctuations. Based on the answers, the investor is categorized as conservative, moderate, or aggressive. This helps in selecting suitable mutual fund schemes. Q 4. A sum of Rs.5,00,000 was invested by an investor in a 370-day FMP scheme, and the maturity value received was Rs. 5,36,400 . Calculate the capital gain in rupees.Rs. 36400Rs. 34750Rs. 32500Complete data not available CORRECT ANSWER Explanation: Capital gain means the profit earned on the investment. Capital Gain = Maturity Amount − Investment Amount 5,36,400  – 5,00,000 = 36,400 So, the investor earned a profit of Rs. 36,400 on the FMP investment. The number of days (370 days) does not change the capital gain amount in this question. Q 5. Identify the true statement from the options below:A) Expense ratios play a more important role in evaluating debt mutual fund schemes compared to equity schemesB) A fund that has performed well over the long term will necessarily continue to provide higher returns in the futureC) An ultra short-term debt fund will always invest only in high credit quality instrumentsStatement A onlyStatement B onlyStatement C onlyAll are true CORRECT ANSWER Explanation: Expense ratio is very important in debt mutual funds because debt funds generally generate moderate returns. A higher expense ratio can significantly reduce the investor’s final return. Statement B is false because past performance does not guarantee future returns. Statement C is also false as there is no mandatory rule that ultra short duration funds must invest only in high credit quality instruments. The fund manager has discretion on credit quality. Q 6. Which of the following strategies helps in ensuring the suitability of a mutual fund scheme to an investor’s needs and circumstances?Asset allocationTax harvestingDividend strippingIndexation CORRECT ANSWER Explanation: Asset Allocation is the strategy of spreading investments across different asset classes — such as equity, debt, gold, and cash — based on the investor's age, risk appetite, financial goals, and investment horizon. It ensures that the right mix of schemes is chosen that truly suits the investor's personal situation. It helps ensure that the mutual fund investment suits the investor’s financial situation and risk appetite. A proper asset allocation strategy balances risk and return. Q 7. Which of the following correctly describes a mutual fund unit holder?A shareholder in the Asset Management Company (AMC)A depositor in the mutual fundA shareholder of the trustee companyA beneficial owner of the assets held by the fund WRONG ANSWERCORRECT ANSWER: A beneficial owner of the assets held by the fund Explanation: When an investor puts money into a mutual fund, they receive units in return. These units represent their proportionate ownership in the pool of assets held by the fund. The investor is therefore called a \"Beneficial Owner\" — meaning they enjoy the economic benefits (returns, dividends, appreciation) of the underlying assets without directly holding those assets in their name. Q 8. State whether the following statement is correct:'In the Income Distribution cum Capital Withdrawal (IDCW) reinvestment option, investments appreciate more quickly than in the growth option because investors receive extra units.'Determined by whether the scheme is open-ended or closed-endedFalse for all fund categoriesCorrect for all fund categoriesCorrect only for equity-oriented schemes WRONG ANSWERCORRECT ANSWER: False for all fund categories Explanation: This is a very common misconception among investors. Many people think that the IDCW Reinvestment option grows faster because you get \"extra units.\" However, this is NOT true : When an IDCW (dividend) is declared, the NAV of the fund drops by exactly the dividend amount before reinvestment. The additional units you receive are bought at this lower NAV. So the total value of your investment remains the same — you just have more units at a lower NAV. In other words : In the IDCW reinvestment option, the distributed amount is used to buy additional units, but the NAV falls to the extent of the IDCW paid. Therefore, IDCW reinvestment does not grow faster simply because additional units are allotted. Q 9. Identify the statement that is NOT TRUE about the Key Information Memorandum (KIM).KIM contains merely the names of the sponsor, trust, and AMC without explaining their rolesKIM needs to be issued only if an investor requests for itKIM serves as an abridged form of scheme information documentsKIM is attached with every mutual fund application form WRONG ANSWERCORRECT ANSWER: KIM needs to be issued only if an investor requests for it Explanation: The Key Information Memorandum (KIM) is a short summary of the Scheme Information Document (SID). It is mandatory to attach the KIM with every mutual fund application form so investors can understand the scheme before investing. It includes details about the AMC, sponsor, trustee, and their functions. Therefore, it is not given only on request — it must be provided to all investors. Q 10. When an investor applies for mutual fund units in dematerialised form, where will the allotted units be credited?A newly opened Demat account with a depository tied up with the mutual fundThe investor’s Demat account mentioned in the application formA newly created Demat account linked to the mutual fund’s Demat accountAny of the above options WRONG ANSWERCORRECT ANSWER: The investor’s Demat account mentioned in the application form Explanation: When an investor applies for mutual fund units in dematerialised form, the units are credited directly to the investor’s own Demat account. The Demat account details must be provided in the application form. No new Demat account is opened by the mutual fund or depository for this purpose. Hence, the units are credited to the existing Demat account mentioned by the investor. Q 11. An international fund of fund is required to invest at least what percentage of its total assets in the underlying fund ?95%50%80%65% CORRECT ANSWER Explanation: An International Fund of Fund (FoF) mainly invests in units of an overseas mutual fund or scheme. As per SEBI regulations, such funds must invest at least 95% of their total assets in the underlying overseas fund. This ensures the scheme truly reflects international exposure. Q 12. A mutual fund scheme pools funds primarily from investors who have :Similar investment objectivesSimilar surplus funds for investmentInvestors belonging to the same geographical regionSimilar levels of investment capital CORRECT ANSWER Explanation: A mutual fund scheme pools money from a large number of investors who share a common investment objective For example, some investors may want long-term capital growth, some may want regular income, and some may want capital safety. Each type of investor chooses a fund that matches their goal (objective). Q 13. Identify the true statement related to benchmarking of Gold Exchange Traded Funds (ETFs).CRISIL Gilt Fund Index serves as a benchmark for Gold ETFsGold prices are generally used as the benchmark for Gold ETFsBenchmarking is not possible for Gold ETFsGold ETFs do not require any benchmark WRONG ANSWERCORRECT ANSWER: Gold prices are generally used as the benchmark for Gold ETFs Explanation: Gold ETFs invest primarily in physical gold, so their performance is expected to closely reflect the movement in gold prices. Therefore, the most appropriate benchmark for a Gold ETF is the price of gold itself. Q 14. An asset management company cannot recover which of the following expenses from a mutual fund scheme?Expenditure on mandatory statutory advertisementsCosts incurred for investor communicationsInterest paid due to delayed redemption payoutsExpenses related to marketing and sales activities WRONG ANSWERCORRECT ANSWER: Interest paid due to delayed redemption payouts Explanation: An Asset Management Company (AMC) can charge certain operating expenses to a mutual fund scheme such as marketing expenses, statutory advertisement costs and investor communication expenses, because these are part of running and managing the scheme. However, if the AMC delays redemption payments beyond the allowed timeline, the interest penalty for that delay must be borne by the AMC itself and not by the mutual fund scheme or investors. This rule protects investors from suffering due to operational inefficiency or mistakes made by the AMC. Q 15. What is the risk known as which arises out of the mis-pricing or improper valuation of derivative contracts?Credit RiskBasis RiskModel RiskDuration Risk WRONG ANSWERCORRECT ANSWER: Model Risk Explanation: Model risk arises when the pricing or valuation model used for derivatives is incorrect or inappropriate. If the derivative contract is wrongly valued, it can lead to losses for investors or the fund. This risk is especially important in complex financial instruments. Therefore, mis-pricing or improper valuation of derivatives is called model risk. Q 16. An Indian international fund is investing in US stocks. What would be the impact on it if US Dollar appreciates against the Indian Rupee?No impact on the fund as its investing in stocks and not currencyThe NAV of the scheme in Indian Rupees will appreciateThe NAV of the scheme in Indian Rupees will depreciate WRONG ANSWERCORRECT ANSWER: The NAV of the scheme in Indian Rupees will appreciate Explanation: An Indian international mutual fund investing in US stocks is exposed to two things: Performance of the US stocks and Currency movement (USD/INR). So when the US Dollar appreciates against the Indian Rupee: 1. The value of the US assets, when converted into INR, becomes higher 2. Therefore, the NAV of the fund in INR increases, even if the underlying US stocks remain flat. Example : Suppose the fund owns 1,000 US Dollars worth of US stocks. If USD/INR = Rs. 80 then value in INR = Rs. 80,000 If USD/INR rises to Rs. 85 then value in INR = Rs. 85,000 Even if the US stock values remain the same, the NAV rises due to currency appreciation. Q 17. Identify the information which is NOT included in the Statement of Additional Information (SAI) ?Tax, Legal & General InformationCurrent SIP returns of the mutual fund schemesInvestment Valuation NormsRights of Unit-holders WRONG ANSWERCORRECT ANSWER: Current SIP returns of the mutual fund schemes Explanation: Statement of Additional Information (SAI), which has statutory information about the mutual fund or AMC, that is offering the scheme like the Constituents of the mutual fund, Rights of Unit-holders, Investment Valuation Norms, Rights of Unit-holders etc. Latest SIP returns are dynamic performance data that change regularly and are scheme-specific — so they are disclosed through Factsheets or the AMFI website, not in the SAI. Q 18. Non resident Indian (NRI) applications should be accompanied by cheque drawn on _______ for repatriable investments.NRE Account onlyNRO Account onlyNRE and NRO Account onlyLocal Account CORRECT ANSWER Explanation: Non resident Indian (NRI) / Person of Indian Origin (PIO)  residents abroad have the facility of investing on a repatriable basis i.e., when they sell their investments, the sale proceeds can be transferred abroad. Alternatively, they can invest on a non-repatriable basis, in which case the proceeds from the sale of those investments cannot be remitted abroad. NRI/PIO applications need to be accompanied by a cheque drawn on an NRO/NRE account (for non-repatriable investment) or NRE account (for repatriable investment). Q 19. Identify the CORRECT statement/s.A mutual fund unit holder can approach the court of law for a matter which was fairly and transparently stated in the Scheme Documents, but he wasn't aware of itA mutual fund unit holder can approach the court of law for a provision of law, which was fairly and transparently stated in the Scheme Documents, but he wasn't aware of itBoth of the aboveNone of the above WRONG ANSWERCORRECT ANSWER: None of the above Explanation: The principle of caveat emptor (LET THE BUYER BEWARE) applies to mutual fund investments. So, the unit-holder cannot seek legal protection on the grounds of not being aware, especially when it comes to the provisions of law and matters fairly and transparently stated in the Scheme Documents. Q 20. As per the fair valuation principles laid out by SEBI, it is mandatory to disclose thevaluation policy in ______.Statement of Additional InformationStatement of Accounts sent to investors periodicallyFund fact sheetThe fair valuation principles are not to be put in public CORRECT ANSWER Explanation: Disclosure of the valuation policy and procedures approved by the Board of the asset management company shall be made in Statement of Additional Information. Q 21. A mutual fund scheme mentions that it will invest not more than 10% of its assets in the money market. This is considered to be the scheme's ________ .Investment PolicyInvestment ObjectiveStock Market PolicyRisk Profile CORRECT ANSWER Explanation: The Investment Policy of  mutual fund scheme includes the scheme’s asset allocation and investment style. A mutual fund scheme with the objective of providing liquidity would invest in money market instruments or in debt papers of very short-term maturity. At the same time, a mutual fund scheme that aims to generate capital appreciation over long periods would invest in equity shares. This would reflect in the scheme’s asset allocation, which would be disclosed in the Scheme Information Document (SID). Q 22. In a Large Cap mutual fund scheme, the minimum investment limit in equity and equity related instruments of large cap companies is ______ .90%80%70%60% WRONG ANSWERCORRECT ANSWER: 80% Explanation: A Large Cap Fund is an open-ended equity scheme predominantly investing in large cap stocks. As per SEBI rules on asset allocation, the minimum investment in equity and equity related instruments of large cap companies shall be 80 percent of total assets. Q 23. Which entity processes the purchase and redemption transactions of investors of an open-ended fund ?The CustodianThe Broker / Mutual Fund AgentAMFIThe R & T Agent WRONG ANSWERCORRECT ANSWER: The R & T Agent Explanation: The Registrar and Transfer Agency (RTA) maintains investor records as well as allots or redeems units, processes purchase/redemption/switch requests, dividends, etc. It also generates the account statement that an investor receives. Q 24. Which of these authorities uses the information collected under FATCA?Foreign GovernmentIndian GovernmentIndian Tax AuthoritiesAll of the above WRONG ANSWERCORRECT ANSWER: All of the above Explanation: To comply with the requirements of Foreign Account Tax Compliance Act (FATCA) and Common Reporting Standards (CRS) provisions, financial institutions, including mutual funds, are required to undertake due diligence process to identify foreign reportable accounts and collect such information as required under the said provisions and report the same to the US Internal Revenue Service/any other foreign government or to the Indian Govt / Tax Authorities for onward transmission to the concerned foreign authorities. Q 25. The investment in equity and equity related instruments is between _________ in a Balanced Hybrid Fund.Between 65 percent and 80 percent of total assetsBetween 50 percent and 75 percent of total assetsBetween 40 percent and 60 percent of total assetsBetween 10 percent and 25 percent of total assets WRONG ANSWERCORRECT ANSWER: Between 40 percent and 60 percent of total assets Explanation: Balanced Hybrid Fund: An open-ended balanced scheme investing in equity and debt instruments. The investment in equity and equity related instruments shall be between 40 percent and 60 percent of total assets while investment. In Conservative Hybrid Fund, its between10 percent and 25 percent of total assets. In Aggressive Hybrid Fund, its between 65 percent and 80 percent of total assets. Q 26. Which of these is NOT included in the Statement of Account issued by a mutual fund?The Unit BalanceThe NAV at the time of issue of the statementAll the transactions done during the period of the statementThe securities in which the money was invested WRONG ANSWERCORRECT ANSWER: The securities in which the money was invested Explanation: Mutual funds issue the Statement of Account and this shows for each transaction (sale/re-purchase) during that period, the value of the transaction, the relevant NAV and the number of units transacted. Besides, it also provides the closing balance of units held in that folio and the value of those units based on the latest NAV. It does not show in which stocks / debt etc. the money is invested. Q 27. What is the regulatory requirement with respect to a change in the controlling interest in an AMC ?The unitholders have to be given the option to exitA minimum of 50% of the unitholders have to approve the change in controlling interestThe trustees have to give the unitholders the option to wind-up the schemeAll of the above CORRECT ANSWER Explanation: A change in the control of the AMC directly or indirectly can be made only with the prior approval of the trustees and SEBI. A written communication about the change in the control of the AMC is sent to each unitholder and an advertisement is given. The unitholders are given the option to exit on the prevailing Net Asset Value (NAV) without any exit load within a time period not less than 30 calendar days from the date of communication. Q 28. No redemption or subscription is allowed in a Segregated Portfolio - State whether True or False?TrueFalse CORRECT ANSWER Explanation: “Segregated portfolio” means a portfolio, comprising of debt or money market instrument affected by a credit event, that has been segregated in a mutual fund scheme. No redemption or subscription is allowed in the segregated portfolio. However, in order to facilitate exit to unitholders in segregated portfolio, AMC shall enable listing of units of segregated portfolio on the recognized stock exchange. Q 29. A Certificate of Deposit issued by a bank will be for ________ .3 days to 2 Years7 days to 1 Year45 days3 years WRONG ANSWERCORRECT ANSWER: 7 days to 1 Year Explanation: A Certificate of Deposit is a fixed-income financial tool that is governed by the Reserve Bank of India and is issued in a dematerialized form. It is a type of agreement made between the depositors and the banks, wherein the bank pays an interest on your investment. Certificates of Deposit are issued by Banks (for 7 days to 1 year) or by Financial Institutions (for 1 to 3 years). Q 30. Identify the TRUE statement with respect to Trustees of mutual funds.The Trustees can legally change the Asset Management Company (AMC)The Asset Management Company (AMC) appoints the TrusteesThe Trustees appoint the Sponsors of the Asset Management Company (AMC)The Trustees have to approve the appointment of the distributors of its mutual fund schemes CORRECT ANSWER Explanation: The Trustees act as the guardians of the mutual fund and are responsible for protecting the interests of the investors. They supervise the functioning of the Asset Management Company (AMC) and ensure that it complies with SEBI regulations. If the AMC fails to perform its duties properly or acts against the interests of unit holders, the Trustees have the legal authority to replace it. However, the Trustees are not appointed by the AMC and do not approve the appointment of distributors, as these responsibilities lie with the Sponsor and the AMC. The Sponsor is the entity that establishes the mutual fund. It is the Sponsor who appoints the Trustees, not the other way around. Q 31. Identify which of these are Non-Financial transactions?A) Transmission B) Nomination C) Pledge D) SwitchTransmission, Nomination, SwitchTransmission, Nomination, PledgeTransmission, Pledge, SwitchNomination, Pledge, Switch WRONG ANSWERCORRECT ANSWER: Transmission, Nomination, Pledge Explanation: Pledge of units. Nomination and Transmission are  Non Financial transactions in a mutual fund. A Switch is redemption from one scheme and a purchase into another, combined into one transaction and is a financial transaction. Q 32. How will an application to subscribe mutual fund units be treated if an AMFI Registration Number (ARN) is mentioned in the application form and the choice of Regular Plan is indicated ?It will be treated as an incomplete application and rejectedIt will be treated as a regular plan applicationIt will be treated as an incomplete application and returned for completionIt will be treated as a direct plan application WRONG ANSWERCORRECT ANSWER: It will be treated as a regular plan application Explanation: If investment (purchase/repurchase) is routed through a distributor, then it is considered that one has chosen to invest in the Regular Plan. Mutual Fund distributors shall quote a valid ARN and EUIN in the client’s application / transaction feed, in order to place transactions in Regular Plan and receive commissions. Q 33. The NAV which is applicable for processing an investor transaction depends on whether the transaction is received within the _________ .Asset Management Company's office timingsR&T Agents office timingsStock Markets timingCut-off time for the scheme WRONG ANSWERCORRECT ANSWER: Cut-off time for the scheme Explanation: The sale and re-purchase prices are a function of the applicable NAV for the transaction. The applicable NAV depends on the cut-off time prescribed for the particular type of scheme and the transaction value. Q 34. The additional Total Expense Ratio (TER) charged has to be credited back to the Mutual Fund scheme if the inflows from beyond the top 30 cities are redeemed within a period of 1 year from the date of investment. State whether True or False?TrueFalse CORRECT ANSWER Explanation: Mutual funds are allowed to charge an additional TER for inflows from cities beyond the top 30 (B-30 cities). However, if such investments are redeemed within one year, the extra TER collected must be credited back to the scheme. This ensures that investors from B-30 cities are encouraged to stay invested longer. Q 35. A mutual fund scheme shall not invest more than 10 percent of its total NAV in debt instruments. This rule is not applicable for which type of debt instrument?Triparty repo on Government securitiesTreasury BillsGovernment SecuritiesAll of the above WRONG ANSWERCORRECT ANSWER: All of the above Explanation: Restrictions pertaining to investment in Debt Securities: A mutual fund scheme shall not invest more than 10 percent of its total NAV in debt instruments comprising money market instruments and non-money market instruments issued by a single issuer which are rated not below investment grade by a credit rating agency authorized to carry out such activity under the Act. However such limit shall not be applicable for investments in Government Securities, Treasury bills and Triparty repo on Government securities or treasury bills. Q 36. In the Mutual Fund industry - every AMC gives an ARN code number to the mutual fund distributor which is to be renewed every three years - True or False?True - this is as per SEBI rulesFalse - AMFI issues the ARN code number. WRONG ANSWERCORRECT ANSWER: False - AMFI issues the ARN code number. Explanation: The ARN code is given by the Association of Mutual Funds in India (AMFI) and not by the AMC. After obtaining the NISM VA certification and completing KYD requirements, one has to register with AMFI. On registration, AMFI allots an AMFI Registration Number (ARN). Q 37. No investor can have a holding of more than 25 percent of a scheme - State True or False?TrueFalse CORRECT ANSWER Explanation: As per SEBI’s 20/25 Rule for mutual funds: A mutual fund scheme must have at least 20 investors. No single investor can hold more than 25% of the scheme’s corpus. Q 38. Long-term capital gains will be taxed after adjusting for _______ , if any.long-term capital loss onlyshort-term capital loss onlyboth long-term and short-term capital loss WRONG ANSWERCORRECT ANSWER: both long-term and short-term capital loss Explanation: As per Income Tax Act : 1. Short term capital loss is to be set off against short term capital gain or long- term capital gain 2. Long term capital loss can only be set off against long term capital gain. 3. Capital loss, short term or long term, cannot be set off against any other head of income (e.g., salaries). Thus, as per points 1 and 2, Long term capital gains will be taxed after adjusting for both long term and short term capital loss. Q 39. The sponsor of a mutual fund can be compared to the Chief Executive of a company - State True or False?TrueFalse WRONG ANSWERCORRECT ANSWER: False Explanation: The sponsor of a mutual fund is similar to a promoter of a company, as it sets up the mutual fund and appoints the trustees and the Asset Management Company (AMC). The Chief Executive role is performed by the AMC, not the sponsor. Q 40. Identify the TRUE statement/s -A. Time stamping is relevant only for Financial transactions and not for Non-Financial transactionsB. Time stamping is relevant for both Financial and Non-Financial transactionsOnly A is trueOnly B is trueBoth A and B are true CORRECT ANSWER Explanation: Time stamping for financial transactions like purchase and redemptions etc. is very crucial as it determines the NAV at which the transaction will take place. Time stamping for non-financial transactions like the change of address, investor’s acknowledgement etc. is not crucial. Only date stamping is important for such non-financial transactions. Q 41. Key Information Memorandum (KIM) and Scheme Information Document (SID) are two broad types of scheme documents - State whether True or False?TrueFalse WRONG ANSWERCORRECT ANSWER: False Explanation: Scheme Information Document (SID) and Statement of Additional Information (SAI) are primarily the two important documents. Key Information Memorandum (KIM) is a summary of SID and SAI. Q 42. _______ will help the investors understand the suitability of a mutual fund scheme to them.Product LabelStandard Deviation / BetaTracking ErrorAlpha of the scheme CORRECT ANSWER Explanation: The risk levels in different categories of mutual fund schemes can be understood with the help of product labelling of Mutual Funds. SEBI had introduced product labelling of mutual funds to address the issue of mis-selling and to provide investors an easy understanding of the kind of product/scheme they are investing in and its suitability to them. All the mutual funds were required to ‘Label’ their schemes on the parameters such as - Nature of scheme, Investment objective, Level of risk depicted by colour code boxes etc. Q 43. Redemption proceeds has to be paid to the mutual fund unit holders within the time specified by _____ from time to time.AMFISEBIRegistrar of CompaniesMinistry of Finance WRONG ANSWERCORRECT ANSWER: SEBI Explanation: The applicable redemption guidelines for mutual funds are set out in SEBI (Mutual Funds) Regulations, 1996 and as amended from time to time. Q 44. Who has to ensures the compliance of the information contained in the scheme related documents with regulations?The SponsorsThe Asset Management CompanySEBIThe Trustees WRONG ANSWERCORRECT ANSWER: The Trustees Explanation: A Compliance Officer signs a due-diligence certificate to the effect that all regulations have been complied with, and that all the intermediaries mentioned in the scheme related documents have the requisite statutory registrations and approvals.  The Compliance Officer works closely with the Trustees on various compliance and regulatory issues. It is the responsibility of the compliance officer to report any issue of non-compliance directly and immediately to the trustees. Q 45. In case of an Index Fund, the minimum investment in securities of a particular index (which is being replicated/ tracked) shall be ________ .80% of the total assets85% of the total assets90% of the total assets95% of the total assets WRONG ANSWERCORRECT ANSWER: 95% of the total assets Explanation: Index Funds are open-ended scheme replicating/tracking a specific index. The minimum investment in securities of a particular index (which is being replicated/ tracked) shall be 95 percent of total assets. Q 46. Identify the TRUE statement/s :1. The Beta of a diversified stock index is greater than 12. An investment with a beta of 0.8 will move 8 percent when markets move by 10%3. Beta as a measure of risk is relevant only for equity schemes.Only 1 and 2 are trueOnly 2 and 3 are trueOnly 1 and 3 are trueAll 1, 2 and 3 are true WRONG ANSWERCORRECT ANSWER: Only 2 and 3 are true Explanation: Beta measures the fluctuation in periodic returns in a scheme, as compared to fluctuation in periodic returns of a diversified stock index (representing the market) over the same period. The diversified stock index, by definition, has a Beta of 1. Companies or schemes, whose beta is more than 1, are seen as riskier than the market. Beta less than 1 is indicative of a company or scheme that is less risky than the market. An investment with a beta of 0.8 will move 8 percent when markets move by 10 percent. This applies to increase as well as fall in values. An investment with a beta of 1.2 will move by 12 percent both on the upside and downside when markets move (up/down) by 10 percent. Beta as a measure of risk is relevant only for equity schemes. Q 47. Which of the following have the highest credit risk?Money Market FundJunk BondG-Sec FundIncome Fund WRONG ANSWERCORRECT ANSWER: Junk Bond Explanation: Junk bonds are a type of bond that carries a higher risk of default. The issuer of such bonds may not have the adequate cash flow to pay regular interest or repay the principal amount to the bondholders at the time of maturity. The bonds issued by financially struggling companies are termed junk bonds but they pay higher returns to make them attractive to investors. Q 48. Identify the information which is NOT included in the Statement of Additional Information (SAI).Rights of Unit-holdersTransmission procedureSIP returns of the schemesInvestment Valuation Norms WRONG ANSWERCORRECT ANSWER: SIP returns of the schemes Explanation: Statement of Additional Information (SAI), which has statutory information about the mutual fund or AMC, that is offering the scheme like the Constituents of the mutual fund, Rights of Unit-holders, Investment Valuation Norms, Rights of Unit-holders etc. It does not contain information on scheme returns etc. This information is available in the Mutual Fund Fact Sheet. Q 49. An Addendum has to be issued for changes in _______ .Fund Fact SheetHalf yearly results of the mutual fundScheme Information Document (SID)Statement of Additional Information (SAI) WRONG ANSWERCORRECT ANSWER: Scheme Information Document (SID) Explanation: Any changes in the fundamental attributes of a mutual fund scheme require an Addendum to the SID. This ensures that investors are formally notified of modifications in scheme details such as investment objectives, asset allocation, or risk factors. Q 50. Identify the INCORRECT statement/s with respect to investments in real estate.The minimum amount required (Ticket size) for investing in real estate is high compared to other financial assetsThe transaction costs are low for investments in real estate as compared to other financial assetsThe real estate market is quiet illiquid and the pricing is not transparentAll of the above are incorrect WRONG ANSWERCORRECT ANSWER: The transaction costs are low for investments in real estate as compared to other financial assets Explanation: Transaction costs, in the form of stamp duty, registration fees, brokerage etc. are high in real estate transactions. Therefore the statement - 'The transaction costs are low for investments in real estate as compared to other financial assets'  is incorrect. Real estate is a less liquid asset class. The intermediation chain of real estate agents is largely unorganized in India. . Regulatory risk is high in real estate, as is the risk of litigation and other encumbrances. The transparency level is low even among the real estate development and construction companies. Q 51. The portfolio of a fund of funds consists of ______ .Equity securities onlyDebt securities onlyUnits of other mutual fund schemesMoney market securities only WRONG ANSWERCORRECT ANSWER: Units of other mutual fund schemes Explanation: A ‘Fund Of Funds’ (FOF) is an investment strategy of holding a portfolio of other investment funds rather than investing directly in stocks, bonds or other securities. An FOF Scheme of a primarily invests in the units of another Mutual Fund scheme. Q 52. Which of the following is true for unclaimed dividend in mutual fund schemes?Asset Management Company is expected to make a continuous effort to remind the investors to claim their duesThe responsibility for ensuring that the dues are claimed lies with the distributor in a dividend planThe responsibility for ensuring that the dues are claimed lies solely with the investor CORRECT ANSWER Explanation: AMC is expected to make a continuous effort to remind the investors through letters to claim their dues. The Annual Report has to mention the unclaimed amount and the number of such investors for each scheme. Q 53. Identify the TRUE statements with respect to measuring returns for mutual fund schemes.1. The returns published in a mutual fund advertisement should factor the entry or exit load2. Compounded Annual Growth Rate (CAGR) is the accepted standard of showing returns for investment of holding period of more than one year3. Simple returns can be calculated by the formula :(Sale price – Cost price) / Cost price x 100Only 1 and 2 are trueOnly 2 and 3 are trueOnly 1 and 3 are trueAll 1, 2 and 3 are true WRONG ANSWERCORRECT ANSWER: Only 2 and 3 are true Explanation: Statement 1 is false because - the returns published in a mutual fund advertisement would be without factoring the entry or exit load. Statement 2 is true because - CAGR is the standard way to present returns for an investment held for more than one year, as it annualizes the return. Statement 3 is true because -The Simple Return is calculated with the following formula : (Sale price – Cost price) / Cost price  x 100 Q 54. Ms. Apeksha invests Rs 2 crore in a Gilt scheme at 2 pm with a local cheque. What would be the applicable NAV for allotment of units?Closing NAV of date of applicationClosing NAV of next business dayClosing NAV of day immediately preceding the date of applicationNAV of the business day on which the funds are available for utilization WRONG ANSWERCORRECT ANSWER: NAV of the business day on which the funds are available for utilization Explanation: For large investments of Rs. 2 Lakhs and above, SEBI has a special rule — the cut-off time (3:00 PM) does NOT matter! What matters is when the money actually reaches the AMC's bank account and is realised. The applicable NAV depends on when the funds are actually available for utilization by the mutual fund. Since the investor invested Rs.2 crore at 2 PM, the same-day NAV may not apply unless funds are credited and available before the cut-off rules. Therefore, the investor gets the NAV of the day when the funds become available for use. Q 55. Ms Shweta purchases through a distributor 5000 units of a mutual fund scheme at a NAV of Rs 30. The current NAV of the scheme is Rs 28. What will be the trail commission for today if the trail commission rate is 1% per annumRs. 13.8356Rs. 7.2256Rs. 26.7463Rs. 3.8356 WRONG ANSWERCORRECT ANSWER: Rs. 3.8356 Explanation: Trail commission is always calculated on the current NAV. The current total value of investments in the above question is Rs. 28 X 5000 units = Rs. 1,40,000 Trail commission for the day = Current value X trail commission rate p.a./365 = 1,40,000 X 1%  / 365 days = 1400 / 365  = Rs. 3.8356 Q 56. For units of Equity Linked Savings Scheme (ELSS), the lock-in period is ______ .three years from the date of original investment, even in case of subsequent purchases by SIPthree years from the date of original investment for each individual unit for purchases made by SIPThere is no lock-in period if tax exemption is claimed WRONG ANSWERCORRECT ANSWER: three years from the date of original investment for each individual unit for purchases made by SIP Explanation: If one is investing in ELSS through SIP then each investment would be locked-in from the date of the respective investment. The lock-in for the entire amount would not get over on completion of 3 years from the date of the first SIP instalment. Q 57. ______ is used to measure fund’s risk relative to market index.Tracking errorBeta coefficientTreynor ratioSharpe ratio WRONG ANSWERCORRECT ANSWER: Beta coefficient Explanation: Beta is a commonly used risk measure and calculates the relative volatility of a stock or Mutual Fund’s returns as against its benchmark. For example, if the Beta of a Mutual Fund scheme is 1, it means the fund moves in line with the benchmark. Likewise, say the Beta of a fund is higher than 1. Assume it is 1.5. So, if the NIFTY 50 jumps by 1%, the fund benchmarked against NIFTY 50 is likely to go up by 1.5%. Q 58. Who manages the contributions from investors and takes investment decisions in a mutual fund company?The InvestorsThe TrusteesThe Asset Management Company (AMC)The Sponsors WRONG ANSWERCORRECT ANSWER: The Asset Management Company (AMC) Explanation: Fund management is the most critical function in an Asset Management Company. The main function of this team is to invest the investors’ money in line with the stated objective of the scheme and to manage the same effectively. Q 59. The __________ is used by the fund manager to communicate their views on the economy and the markets to the investorsKey Information Memorandum (KIM)Statement of Additional Information (SAI)Scheme Information Document (SID)Fund Factsheet WRONG ANSWERCORRECT ANSWER: Fund Factsheet Explanation: A Fund Factsheet is like a monthly report card of a mutual fund scheme. It is published every month by the AMC and is the most investor-friendly document among all MF documents. It typically includes the fund manager's commentary on the economy, current market conditions, sector outlook, portfolio composition, top holdings, and scheme performance — making it the go-to document for anyone wanting to understand where the markets are headed and how the fund is positioned. Q 60. The equity share prices of gold mining companies can depend on :1. The gold reserves of the company2. The operational efficiency and management of the company3. International prices of goldOnly 1 and 2Only 2 and 3Only 1 and 3All 1, 2 and 3 WRONG ANSWERCORRECT ANSWER: All 1, 2 and 3 Explanation: Profitability of gold mining companies is linked to several factors. For eg. - When gold metal price increases, gold mining companies with large reserves of gold can appreciate If there are concerns about a company’s management the share prices may see a decline irrespective of the price of gold. Q 61. Identify the FALSE statement/s :1. A mutual fund investing across many countries will keep its benchmark index which is based on US equity markets2. For Gold ETF, gold prices will be the ideal benchmarkOnly 1 is falseOnly 2 is falseBoth 1 and 2 are false CORRECT ANSWER Explanation: The benchmark would depend on where the scheme proposes to invest. Thus, a scheme seeking to invest in China might have the Shanghai Composite Index (Chinese index) as the benchmark. S&P 500 may be appropriate for a scheme that would invest largely in the US market. A scheme that seeks to invest across a number of countries, can structure a synthetic index that would be a blend of the indices relevant to the countries where it proposes to invest. Gold ETF NAVs closely track the price of gold since it reflects the value of gold held in custody for the units issued. Therefore, gold price would be the benchmark for such funds. Q 62. An Asset Management Company (AMC) can recover investment management and advisory fees on management of the unclaimed amounts, ________ .only on the actual expenses incurred in holding the fundsat a maximum rate of 0.50 percent per annumas per the fee applicable on the scheme from which the redemption was madeNo investment management and advisory fees can be charged on unclaimed amounts WRONG ANSWERCORRECT ANSWER: at a maximum rate of 0.50 percent per annum Explanation: AMC is expected to make a continuous effort to remind the investors through letters to claim their uncliamed amounts. AMC can recover investment management and advisory fees on management of these unclaimed amounts, at a maximum rate of 0.50 percent per annum. Q 63. Identify which among the following is the first step in the sequence of creating a mutual fund product?Launching the New Fund Offer (NFO)Filing of Scheme Information Document (SID) with SEBI for observationLaunch of advertising and public relations campaigns by AMCApproval of Trustees and AMC board for the new product and drafting of SID WRONG ANSWERCORRECT ANSWER: Approval of Trustees and AMC board for the new product and drafting of SID Explanation: Units in a mutual fund scheme are offered to investors for the first time by a New Fund Offer (NFO).The following are a few key steps leading to the NFO : 1. AMC decides on a scheme to take to the market. This is decided on the basis of inputs from the Chief Investment Officer (CIO) and the Chief Marketing Officer (CMO) 2. AMC prepares the Scheme Information Document (SID) for the NFO. This needs to be approved by the Trustees and the Board of Directors (BoD) of the AMC. 3. The documents are then filed with SEBI. 4. The AMC decides on a suitable timetable for the issue. launches its advertising and public relations campaigns etc 5. The Scheme Documents and Application Forms are distributed to market intermediaries, and circulated in the market so that investors can apply in the NFO. Q 64. From the below mentioned entities associated with a mutual fund, who has to mandatorily contribute to the corpus of the mutual fund?The TrusteesThe CustodiansThe Asset Management CompanyThe Sponsors WRONG ANSWERCORRECT ANSWER: The Sponsors Explanation: The mutual fund trust is created by one or more Sponsors, who are the main persons behind the mutual fund business. The sponsor is the promoter of the mutual fund. The sponsor brings in capital and creates a mutual fund trust and sets up the AMC. The sponsor makes an application for registration of the mutual fund and contributes at least 40% of the net worth of the AMC. In other words, every MF needs a sponsor before it can commence operations. Q 65. The benchmark for a debt mutual fund scheme could be chosen on the basis of Scheme Type and Scheme Size. - State whether True or False?TrueFalse WRONG ANSWERCORRECT ANSWER: False Explanation: Scheme type and Choice of investment universe drive the choice of benchmark in debt schemes. For eg - Liquid schemes invest in securities of up to 91 days’ maturity. Therefore, a short-term money market benchmark such as NSE’s MIBOR or CRISIL Liquid Fund Index is suitable. Choice of Investment Universe Gilt funds invest only in Government securities. Therefore, indices based on Government Securities are appropriate. Debt funds that invest in a wide range of Government and Non-Government securities need to choose benchmarks that are calculated based on a diverse mix of debt securities. The size of the scheme is immaterial. Q 66. Once the mutual fund units are pledged, the unit holder/s _______ .Cannot sell the unitsCan sell the units but after a period of 3 monthsCannot sell the units but can switch the units to another schemeCannot do additional purchase in the same account CORRECT ANSWER Explanation: Banks, NBFCs and other financiers often lend money against the pledge of Units by the Unitholder. Once units are pledged, the Unit-holder/s cannot sell or switch out the pledged units, until the pledgee gives a written no-objection to release the pledge. Q 67. Where is the performance data for all schemes across the mutual fund industry available?The Scheme Information Document (SID)Key Information Memorandum (KIM)AMFI WebsiteThe Fund Fact Sheet WRONG ANSWERCORRECT ANSWER: AMFI Website Explanation: Each AMC is required to publish a scheme performance dashboard on its website, and update it on a regular basis. The scheme performance data is also available on the AMFI website AMFI website (www.amfiindia.com) carries the performance data of all the mutual fund schemes.This is an exhaustive resource and one can access the same for various different periods, and fund categories. Q 68. What would be the impact on an International fund investing in US stocks when the US Dollar appreciates against Indian Rupee?The NAV of the scheme in Indian Rupees will appreciateThe NAV of the scheme in Indian Rupees will depreciateNo impact on the fund as its investing in stocks and not currency CORRECT ANSWER Explanation: When an Indian investor invests in equities abroad, he is essentially taking two exposures: - An exposure on the international equity market. - An exposure to the exchange rate of the rupee. If the investor invests in the US, and the US Dollar becomes stronger during the period of his investment, he benefits; if the US Dollar weakens (i.e., Rupee becomes stronger), he loses or the portfolio returns will be lower. Q 69. How will the AMC /R&T agent process an application for subscribing to mutual fund units if the ARN is wrongly mentioned in it?It will be processed as a direct plan applicationIt will be rejected as incomplete applicationIt will be considered as an incomplete application and sent back for completionIt will be treated as a regular plan subject to the error being corrected in the required time frame WRONG ANSWERCORRECT ANSWER: It will be treated as a regular plan subject to the error being corrected in the required time frame Explanation: If the wrong ARN code is mentioned in the application form, then the application will be processed as a Regular Plan. However, the AMC will contact the investor/distributor for the right ARN code within 30 calendar days of the receipt of the application form. If the error is not rectified within these 30 days, the application will be reprocessed as a direct application without charging any exit load. Q 70. Which one of these is an advantage of investing in Mutual Funds?Economies of scalePortfolio customizationChoice overloadAll of the above CORRECT ANSWER Explanation: Large investment corpus of a mutual fund leads to various other economies of scale. For instance, costs related to investment research and office space gets spread across investors. Further, the higher transaction volume makes it possible to negotiate better terms with brokers, bankers and other service providers. Limitations of Mutual Fund - Lack of Portfolio Customization - A unitholder cannot influence what securities or investments the scheme would invest into. Choice Overload - There are multiple mutual fund schemes offered by several mutual fund houses and multiple options within those schemes which makes it difficult for investors to choose between them."}]

ll('.opt').forEach((b,n)=>{if(q.opts[n]===q.ans)b.classList.add('correct');if(n===k&&!ok)b.classList.add('wrong');b.disabled=true});$('feedback').innerHTML='<div class="feedback '+(ok?'good':'bad')+'"><b>'+(ok?'Correct!':'Wrong!')+'</b><br>Correct answer: '+esc(q.ans)+'</div><div class="explain"><b>Explanation:</b><br>'+esc(q.exp)+'</div>';$('next').classList.remove('hidden')}function nextQ(){if(i===questions.length-1){endExam(false);return}i++;render();window.scrollTo({top:0,behavior:'smooth'})}function endExam(auto){if(ended)return;ended=true;clearInterval(timerId);$('quiz').classList.add('hidden');$('fill').style.width='100%';$('progressText').textContent='Exam ended';$('timer').textContent=formatTime(elapsed);$('result').classList.remove('hidden');const correct=answers.filter((a,n)=>a!==null&&questions[n].opts[a]===questions[n].ans).length;const wrong=answers.filter((a,n)=>a!==null&&questions[n].opts[a]!==questions[n].ans).length;const unanswered=questions.length-correct-wrong;const pct=Math.round((correct/questions.length)*100);const pass=pct>60;const status=pass?'PASS':'TRY AGAIN';$('result').innerHTML='<h2>Exam Result</h2><div class="score">'+correct+' / '+questions.length+'</div><p><b>'+status+'</b></p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left;margin:20px 0"><div class="card" style="margin:0;padding:14px"><b>Correct</b><br>'+correct+'</div><div class="card" style="margin:0;padding:14px"><b>Wrong</b><br>'+wrong+'</div><div class="card" style="margin:0;padding:14px"><b>Unanswered</b><br>'+unanswered+'</div><div class="card" style="margin:0;padding:14px"><b>Marks</b><br>'+correct+' / '+questions.length+'</div><div class="card" style="margin:0;padding:14px"><b>Percentage</b><br>'+pct+'%</div><div class="card" style="margin:0;padding:14px"><b>Time Taken</b><br>'+formatTime(elapsed)+'</div></div><p class="small">'+(auto?'Exam ended automatically. ':'You ended the exam. ')+(pass?'You have passed the exam.':'Your score is 60% or below. Please try again.')+'</p><button class="btn start" onclick="location.reload()">Restart Exam</button>'}function formatTime(sec){return Math.floor(sec/60).toString().padStart(2,'0')+':'+(sec%60).toString().padStart(2,'0')}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}</script></body></html>
